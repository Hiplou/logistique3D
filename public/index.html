<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
/* R\u00e9v\u00e9lateur d'erreurs : sur iPhone il n'y a pas de console \u00e0 port\u00e9e de main.
   Toute erreur s'affiche dans un bandeau rouge, avec sa ligne, qu'il suffit
   de photographier. Un appui le fait dispara\u00eetre. */
(function(){
  function montre(msg, ligne, col){
    try{
      var b = document.getElementById('bandeau-erreur');
      if(!b){
        b = document.createElement('div');
        b.id = 'bandeau-erreur';
        b.setAttribute('style','position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));'
          + 'z-index:2147483600;background:#8E2F3F;color:#fff;font:12px/1.45 -apple-system,system-ui,sans-serif;'
          + 'padding:10px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:pre-wrap;');
        b.onclick = function(){ b.remove(); };
        (document.body || document.documentElement).appendChild(b);
      }
      b.textContent = 'Erreur : ' + msg + (ligne ? '\nligne ' + ligne + (col ? ', colonne ' + col : '') : '')
        + '\n(touchez pour fermer)';
    }catch(e){}
  }
  window.addEventListener('error', function(e){
    montre(e.message || String(e.error || 'inconnue'), e.lineno, e.colno);
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason; montre((r && (r.message || r)) || 'promesse rejet\u00e9e');
  });
})();
</script>

<style>
  :root{
    --bg:#F7F3EC;
    --panel:#FFFFFF;
    --border:#E6DED2;
    --ink:#1E1B18;
    --ink-soft:#7A6F62;
    --teal:#1B3FB0;
    --teal-dark:#142C7A;
    --teal-pale:#E7EBFA;
    --rust:#8E2F3F;
    --rust-pale:#F7E6E8;
    --amber:#B87333;
    --amber-pale:#F6E9DC;
    --green:#4F7A5C;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:30px;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- App shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Top nav ---------- */
  #topbar{
    position:sticky;top:0;z-index:40;
    background:var(--teal-dark);
    color:#EDF0FC;
    padding:calc(10px + env(safe-area-inset-top)) 14px 0 14px;
  }
  #topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  #brand{display:flex;align-items:center;gap:8px;}
  #brand .tooth{width:22px;height:22px;flex:none;}
  #brand span{font-family:'Fraunces',serif;font-weight:600;font-size:16px;white-space:nowrap;}
  /* Un seul bouton rond : ne déborde jamais, quelle que soit la largeur d'écran */
  #userbadge{
    display:flex;align-items:center;justify-content:center;flex:none;
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.22);
    border-radius:999px;padding:3px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #userbadge:active{ background:rgba(255,255,255,0.2); }
  .menu-ligne{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;font-size:14.5px;color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .menu-ligne:active{ background:var(--mint); }
  .menu-ligne .ic{ font-size:17px;width:22px;text-align:center;flex:none; }
  .menu-ligne .sous{ display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px; }
  #userbadge .avatar{
    width:22px;height:22px;border-radius:50%;background:var(--rust);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
    font-family:'IBM Plex Mono',monospace;
  }
  #userbadge button{background:none;border:none;color:#C9D2F4;font-size:12px;text-decoration:underline;padding:0;}

  #tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:rgba(255,255,255,0.12);
    cursor:pointer;
    background:transparent;border:none;color:#BFDAD3;
    padding:9px 12px 11px 12px;font-size:12.5px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    border-bottom:3px solid transparent;white-space:nowrap;
  }
  .tab-btn svg{width:17px;height:17px;}
  .tab-btn.active{color:#fff;border-bottom-color:var(--rust);}
  .tab-badge{
    background:var(--rust);color:#fff;border-radius:999px;font-size:10px;
    padding:0 5px;min-width:15px;line-height:15px;position:absolute;margin-left:14px;margin-top:-4px;
  }

  /* ---------- Content ---------- */
  #content{flex:1;padding:16px 14px calc(90px + env(safe-area-inset-bottom)) 14px;max-width:960px;width:100%;margin:0 auto;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}

  /* ---- Panier d'entrées / sorties ---- */
  .panier{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);overflow:hidden;margin-top:12px;}
  .panier-tete{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 13px;background:var(--teal-pale);border-bottom:1px solid var(--border);}
  .panier-tete.out{background:var(--rust-pale);}
  .panier-tete h4{margin:0;font-size:14px;font-weight:650;}
  .panier-ligne{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);}
  .panier-ligne:last-child{border-bottom:none;}
  .panier-nom{flex:1;min-width:0;font-size:14px;line-height:1.25;}
  .panier-nom .sub{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .panier-nom .manque{color:var(--rust);font-weight:600;}
  .qte-bloc{display:flex;align-items:center;gap:6px;flex:none;}
  .qte-btn{width:31px;height:31px;border-radius:9px;border:1px solid var(--border);background:#fff;
    font-size:17px;line-height:1;color:var(--teal);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
  .qte-btn:active{background:var(--teal-pale);}
  .qte-val{min-width:46px;height:31px;border-radius:9px;border:1px solid var(--border);background:var(--mint,#F2F8F6);
    font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink);}
  .qte-suppr{background:none;border:none;color:var(--ink-soft);font-size:17px;cursor:pointer;padding:2px 2px;flex:none;}
  .panier-pied{padding:12px;display:flex;flex-direction:column;gap:8px;}
  .panier-vide{padding:20px 14px;text-align:center;color:var(--ink-soft);font-size:13px;}

  /* ---- Écran d'accueil : vignettes ---- */
  .tuiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
  @media(min-width:620px){ .tuiles{grid-template-columns:repeat(3,1fr);} }
  .tuile{
    position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:15px 14px 14px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);
    min-height:118px;transition:transform .08s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .tuile:active{ transform:scale(.975); }
  .tuile-ic{
    width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--teal-pale);color:var(--teal);margin-bottom:7px;flex:none;
  }
  .tuile-ic svg{width:20px;height:20px;}
  .tuile-titre{font-weight:650;font-size:14.5px;line-height:1.2;}
  .tuile-chiffre{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;line-height:1.15;margin-top:5px;}
  .tuile-sous{font-size:11.5px;color:var(--ink-soft);line-height:1.35;margin-top:1px;}
  .tuile-pastille{
    position:absolute;top:11px;right:11px;background:var(--rust);color:#fff;
    font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;
  }
  .tuile.alerte{ border-color:#F0C4B4; background:#FFFCFB; }
  .tuile.alerte .tuile-ic{ background:var(--rust-pale);color:var(--rust); }
  .accueil-salut{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;margin:2px 0 2px 0;}
  .accueil-date{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
  .panel-title h2{margin:0;font-size:19px;font-weight:600;}
  .subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .subtab-btn{
    background:var(--teal-pale);border:1px solid transparent;color:var(--teal-dark);
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;
  }
  .subtab-btn.active{background:var(--teal);color:#fff;}

  .btn{border:none;border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:active{background:var(--teal-dark);}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--ink);}
  .btn-rust{background:var(--rust);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:0.45;}

  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);
  }
  label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
  .field{margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ---------- Product rows ---------- */
  .search-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .search-row input{flex:1;min-width:140px;}
  .checkline{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .prow{
    display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--border);
  }
  .prow:last-child{border-bottom:none;}
  .prow.out{opacity:0.42;}
  .prow .pinfo{flex:1;min-width:0;cursor:pointer;}
  .prow .pname{font-weight:600;font-size:14.5px;}
  .prow .pmeta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .qty-pill{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;padding:3px 9px;border-radius:7px;
    background:var(--teal-pale);color:var(--teal-dark);white-space:nowrap;
  }
  .qty-pill.low{background:var(--rust-pale);color:var(--rust);}
  .qty-pill.zero{background:#eee;color:#888;}
  .cat-tag{display:inline-block;font-size:10.5px;background:var(--amber-pale);color:var(--amber);padding:1px 7px;border-radius:999px;margin-top:3px;font-weight:600;}

  /* ---------- Modal ---------- */
  /* La hauteur est donnée en dvh : sur iPhone, vh inclut la barre d'adresse
     et déborde sous l'écran. Le bas réserve la place du bandeau de signature,
     pour que la feuille s'arrête au-dessus plutôt que de passer dessous. */
  .overlay{position:fixed;left:0;right:0;top:0;bottom:0;height:100vh;height:100dvh;
    background:rgba(12,20,32,0.55);display:flex;align-items:flex-end;justify-content:center;
    z-index:100;padding-bottom:calc(29px + env(safe-area-inset-bottom));
    overscroll-behavior:contain;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:480px;
    max-height:calc(100vh - 60px - env(safe-area-inset-bottom));
    max-height:calc(100dvh - 60px - env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:18px;}

  .modal h3{margin:0 0 14px 0;font-size:17px;}
  /* Les formulaires longs se terminent sous le bandeau de signature :
     on garde la rangée d'action collée au bas de la zone visible. */
  .modal-actions{position:sticky;bottom:-18px;display:flex;gap:8px;background:#fff;
    margin-top:12px;padding:10px 0 18px 0;
    box-shadow:0 -12px 16px -12px rgba(20,32,60,0.30);z-index:2;}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);}

  /* ---------- Keypad ---------- */
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .keypad button{padding:16px;font-size:19px;font-weight:600;border-radius:10px;border:1px solid var(--border);background:#fafcfb;}
  .keypad-display{font-family:'IBM Plex Mono',monospace;font-size:30px;text-align:center;padding:14px;background:var(--teal-pale);border-radius:10px;color:var(--teal-dark);font-weight:700;}

  /* ---------- Options list (sortie) ---------- */
  .opt-list{display:flex;flex-direction:column;gap:8px;}
  .opt-btn{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#fafcfb;font-size:14px;font-weight:600;}
  .opt-btn:active{background:var(--teal-pale);}

  /* ---------- Login ---------- */
  #login-overlay{position:fixed;inset:0;background:var(--teal-dark);display:flex;align-items:center;justify-content:center;z-index:200;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;}
  .login-card{background:#fff;border-radius:24px;padding:28px 24px;max-width:360px;width:100%;text-align:center;}
  .login-card .tooth{width:40px;height:40px;margin:0 auto 10px auto;}
  .login-card h1{font-size:20px;margin:0 0 4px 0;}
  .login-card p{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px 0;}

  /* ---------- Autocomplete ---------- */
  .ac-list{border:1px solid var(--border);border-radius:8px;margin-top:6px;max-height:220px;overflow-y:auto;}
  .ac-item{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:active{background:var(--teal-pale);}
  .ac-item .sub{font-size:11.5px;color:var(--ink-soft);}

  /* ---------- Camera capture card ---------- */
  .cap-box{border:2px dashed var(--border);border-radius:12px;padding:26px 14px;text-align:center;color:var(--ink-soft);}
  .cap-box img{max-width:100%;border-radius:8px;margin-top:10px;}

  .empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .prod-row{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:11px 13px;margin-bottom:9px;}
  .prod-row-nom{font-weight:600;font-size:14px;color:var(--ink);}
  html.fenetre-ouverte, html.fenetre-ouverte body{overflow:hidden;}
  .reglage-prix{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;
    font-size:11.5px;color:var(--ink-soft);}
  .reglage-prix select,.reglage-prix input{font-size:11.5px;color:var(--ink-soft);
    background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;
    padding:2px;width:auto;min-width:0;-webkit-appearance:none;appearance:none;}
  .reglage-prix select{padding-right:13px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),
      linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 6px) 55%,calc(100% - 2px) 55%;
    background-size:4px 4px,4px 4px;background-repeat:no-repeat;}
  .reglage-prix input{width:34px;text-align:center;}
  .reglage-prix select:focus,.reglage-prix input:focus{outline:none;border-bottom-color:var(--teal);}
  .cmd-etat{flex:none;width:14px;height:14px;border-radius:50%;display:block;
    box-shadow:0 0 0 3px rgba(0,0,0,0.05);}
  .prod-row-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.45;}
  .prod-h{font-size:13px;font-weight:600;color:var(--ink-soft);margin:18px 0 8px 0;}
  .cat-pastille{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;
    vertical-align:middle;}
  .palette{display:flex;flex-wrap:wrap;gap:7px;}
  .palette button{width:26px;height:26px;border-radius:50%;border:none;padding:0;cursor:pointer;}
  .prod-note{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:12px 0 0 0;}
  .rp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);
    border-radius:12px;background:var(--panel);}
  table.rp{border-collapse:collapse;font-size:11px;}
  table.rp th,table.rp td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    padding:4px;vertical-align:top;min-width:88px;}
  table.rp thead th{position:sticky;top:0;background:var(--bg);font-weight:500;
    color:var(--ink-soft);text-align:center;line-height:1.25;padding:6px 4px;z-index:2;}
  table.rp th.rp-mac{position:sticky;left:0;background:var(--panel);text-align:left;
    font-weight:600;color:var(--ink);min-width:112px;max-width:112px;z-index:3;font-size:11.5px;}
  table.rp thead th.rp-mac{z-index:4;background:var(--bg);}
  table.rp .rp-auj{background:var(--teal-pale);}
  table.rp tr.rp-lieu th,table.rp tr.rp-lieu td{background:var(--teal-dark);color:#EDF0FC;
    font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:5px 8px;}
  table.rp tr.rp-lieu th.rp-mac{background:var(--teal-dark);color:#EDF0FC;}
  .rp-chip{border-radius:7px;padding:4px 6px;margin-bottom:4px;line-height:1.3;
    font-size:10.5px;word-break:break-word;}
  .rp-chip span{display:block;font-size:9.5px;opacity:.75;}
  .rp-todo{background:var(--teal);color:#fff;cursor:pointer;}
  .rp-ok{background:transparent;color:var(--ink-soft);border:1px dashed var(--border);opacity:.65;}
  .rp-ko{background:transparent;color:var(--rust);border:1px dashed var(--rust);opacity:.7;

<script>
/* ======================= ETAT & STOCKAGE ======================= */
window.addEventListener('error', function(e){ console.warn('Erreur capturée :', e.message); });
window.addEventListener('unhandledrejection', function(e){ console.warn('Promesse rejetée capturée :', e.reason); e.preventDefault && e.preventDefault(); });

// Filet de sécurité : si l'API de stockage cloud n'est pas disponible ou répond trop lentement,
// on bascule sur une mémoire locale temporaire pour que l'application reste utilisable.
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))
  ]);
}
/* =================================================================
   CONFIGURATION SUPABASE  (multi-comptes)
   -----------------------------------------------------------------
   Remplacez les deux valeurs ci-dessous par celles de VOTRE projet
   Supabase. On les trouve dans :
        Supabase  ->  Project Settings  ->  API
   - url     : "Project URL"        (ex. https://abcd1234.supabase.co)
   - anonKey : "anon public" key    (longue chaîne commençant par eyJ...)

   IMPORTANT : la clé "anon" est PUBLIQUE, elle est faite pour être
   visible dans le code. Ce n'est pas une fuite. Ce qui protège les
   données, c'est la "Row Level Security" activée dans la base :
   chaque compte ne peut lire et écrire QUE sa propre ligne, et la
   base le vérifie côté serveur à chaque requête.
   N'utilisez JAMAIS ici la clé "service_role" (celle-là est secrète).
   ================================================================= */
const SUPABASE_CONFIG = {
  url:     "https://dvqkcnmuzntatmsqllft.supabase.co",
  anonKey: "sb_publishable_5KsR3xF1dOUTVeoYoM6V-g_95zbrkoy"
};
const TABLE = "comptes_stock";   // nom de la table créée par le script SQL

/* ---------------------------------------------------------------
   INSCRIPTION LIBRE
   Chaque entreprise peut créer son propre compte depuis l'application.
   Les données restent totalement cloisonnées : un nouveau compte
   démarre avec un stock vide et ne voit jamais ceux des autres.

*/

/* Où conserver la session ouverte ?
   - "Rester connecté" coché  : dans localStorage, la session survit à la
     fermeture du navigateur. C'est le cas normal sur un appareil de l'entreprise.
   - décoché : dans sessionStorage, la session disparaît dès que l'onglet est
     fermé. À utiliser sur un poste partagé ou un ordinateur prêté.
   Le choix est relu à chaque accès, il peut donc changer d'une fois sur l'autre. */
const CLE_SOUVENIR = 'stock_rester_connecte';
function sessionPersistante(){
  try{ return localStorage.getItem(CLE_SOUVENIR) !== '0'; }catch(e){ return true; }
}
const STOCKAGE_SESSION = {
  getItem(k){
    try{ return (sessionPersistante() ? localStorage : sessionStorage).getItem(k); }
    catch(e){ return null; }
  },
  setItem(k, v){
    try{
      if(sessionPersistante()){ localStorage.setItem(k, v); try{ sessionStorage.removeItem(k); }catch(e){} }
      else { sessionStorage.setItem(k, v); try{ localStorage.removeItem(k); }catch(e){} }
    }catch(e){}
  },
  removeItem(k){
    try{ localStorage.removeItem(k); }catch(e){}
    try{ sessionStorage.removeItem(k); }catch(e){}
  }
};

/* Client Supabase (créé une seule fois au chargement) */
let sb = null;
function cloudReady(){ return !!sb; }
(function initSupabase(){
  try{
    if(!window.supabase || !window.supabase.createClient) return;
    if(!SUPABASE_CONFIG.url || SUPABASE_CONFIG.url.indexOf('VOTRE-PROJET') !== -1) return;
    if(!SUPABASE_CONFIG.anonKey || SUPABASE_CONFIG.anonKey.indexOf('COLLEZ-ICI') !== -1) return;
    sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, {
      auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false,
             storage: STOCKAGE_SESSION }
    });
  }catch(e){ console.warn('Supabase indisponible', e); sb = null; }
})();

/* Compte actuellement connecté : {userId, email, nom} */
let account = null;
if(typeof window.storage === 'undefined' || !window.storage){
  window.storage = {
    _mem:{},
    async get(key){ if(!(key in this._mem)) throw new Error('introuvable'); return {key, value:this._mem[key]}; },
    async set(key,value){ this._mem[key]=value; return {key,value}; },
    async delete(key){ delete this._mem[key]; return {key, deleted:true}; },
    async list(prefix){ return {keys:Object.keys(this._mem).filter(k=>!prefix||k.startsWith(prefix))}; },
  };
}

const CATS_DEFAULT = [
  {name:"Filament 3D", color:"#1B3FB0"},
  {name:"Luminaire", color:"#B87333"},
  {name:"Objet déco", color:"#4F7A5C"},
  {name:"Mobilier", color:"#8E2F3F"},
  {name:"Bijou", color:"#7FB2DD"},
  {name:"Emballage", color:"#8A9A6B"},
  {name:"Quincaillerie", color:"#3D5068"},
  {name:"Consommable", color:"#9A9186"},
  {name:"Autre", color:"#24211E"},
];
const CAT_PALETTE = ["#1B3FB0","#B87333","#4F7A5C","#8E2F3F","#7FB2DD","#8A9A6B","#3D5068","#9A9186","#24211E","#C9623F","#5E4B8B","#D9A441"];
function catColor(name){
  const c = state.categories.find(c=>c.name===name);
  return c ? c.color : '#94A5A1';
}
function catTagHTML(name){
  if(!name) return '';
  return `<span class="cat-tag" style="background:${catColor(name)}22;color:${catColor(name)};"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${catColor(name)};margin-right:4px;"></span>${esc(name)}</span>`;
}
function productNameHTML(p){
  // Si un surnom existe, on l'affiche en principal et le nom officiel en dessous (petit).
  if(p.nickname && p.nickname.trim()){
    return `${esc(p.nickname)}<div style="font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:1px;">${esc(p.name)}</div>`;
  }
  return esc(p.name);
}

let state = {
  user: null,
  products: [],     // {id,name,category,supplier,supplierRef,price,threshold,unit,photo}
  movements: [],     // {id,productId,type:'in'|'out',qty,date,user,note,source}
  categories: [...CATS_DEFAULT],
  suppliers: [],     // {id,name,email,phone,address,iban}
  printers: [],      // {id,nom,modele,actif}
  recipes: [],       // {id,nom,filamentId,piecesParBobine,minutesPiece,printerIds[]}
  orders: [],        // {id,client,dateLivraison,lignes:[{recipeId,qte}],note,fait}
  sites: [],         // {id,nom,planning{0..6:{actif,de,a}},exceptions[]}
  runs: [],          // {id,orderId,recipeId,printerId,pieces,statut,at,user}
  artCats: [],       // {id,nom,couleur} — catégories des articles de production
  prod: {},          // reglages : delais, manipulation, marge de bobines
};
let activeTab = 'accueil';
let activeSub = {arrivee:'manuel', sortie:'manuel', produit:'produits', stock:'tous', production:'planning', articles:'liste'};
let showOutOfStock = false;

async function safeGet(key, shared){
  try{
    const listing = await withTimeout(window.storage.list(key, shared), 3000);
    if(!listing || !listing.keys || !listing.keys.includes(key)) return null;
    return await withTimeout(window.storage.get(key, shared), 4000);
  }catch(e){ return null; }
}
/* Applique un objet de données (venant du cloud ou d'une sauvegarde) à l'état. */
function applyData(d){
  state.products   = (d && d.products)   || [];
  state.movements  = (d && d.movements)  || [];
  state.categories = normalizeCategories(d && d.categories);
  state.suppliers  = (d && d.suppliers)  || [];
  state.printers   = (d && d.printers)   || [];
  state.recipes    = (d && d.recipes)    || [];
  state.orders     = (d && d.orders)     || [];
  state.prod       = (d && d.prod)       || {};
  state.sites      = (d && d.sites)      || [];
  state.runs       = (d && d.runs)       || [];
  state.artCats    = (d && d.artCats)    || [];
}
function currentData(){
  return {
    products: state.products, movements: state.movements,
    categories: state.categories, suppliers: state.suppliers,
    printers: state.printers, recipes: state.recipes,
    orders: state.orders, prod: state.prod, sites: state.sites, runs: state.runs,
    artCats: state.artCats
  };
}

async function loadAll(){
  // Version SUPABASE : chaque compte possède UNE ligne dans la table,
  // et la base refuse l'accès aux lignes des autres comptes (RLS).
  if(cloudReady() && account){
    try{
      const { data, error } = await withTimeout(
        sb.from(TABLE).select('donnees,nom').eq('user_id', account.userId).maybeSingle(),
        12000
      );
      if(error) throw error;
      if(data){
        applyData(data.donnees || {});
        if(data.nom) account.nom = data.nom;
      }else{
        // Tout premier accès de ce compte : on part d'un stock vide et on crée la ligne.
        applyData(null);
        __syncDirty = true;
        pushToCloud();
      }
      saveLocalMirror();
      chargerPaniers();
      window.__storageMode = 'supabase';
      return;
    }catch(e){
      console.warn('Chargement cloud impossible', e);
      window.__storageMode = 'local-fallback';
    }
  } else {
    window.__storageMode = 'local';
  }
  loadLocalMirror();
}
/* Miroir local : CLOISONNÉ PAR COMPTE.
   Deux comptes utilisés sur le même appareil (même iPhone, même
   navigateur) ne peuvent pas voir la copie hors-ligne l'un de l'autre,
   car la clé de stockage contient l'identifiant du compte. */
function mirrorKey(nom){
  const id = account ? account.userId : 'anonyme';
  return 'stock::' + id + '::' + nom;
}
function loadLocalMirror(){
  const g = k => (window.localStorage ? localStorage.getItem(mirrorKey(k)) : null);
  try{ state.products   = JSON.parse(g('products')  || '[]'); }catch(e){ state.products = []; }
  try{ state.movements  = JSON.parse(g('movements') || '[]'); }catch(e){ state.movements = []; }
  try{ state.categories = normalizeCategories(JSON.parse(g('categories') || 'null')); }catch(e){ state.categories = [...CATS_DEFAULT]; }
  try{ state.suppliers  = JSON.parse(g('suppliers') || '[]'); }catch(e){ state.suppliers = []; }
}
function saveLocalMirror(){
  try{
    if(!window.localStorage) return;
    localStorage.setItem(mirrorKey('products'),   JSON.stringify(state.products));
    localStorage.setItem(mirrorKey('movements'),  JSON.stringify(state.movements));
    localStorage.setItem(mirrorKey('categories'), JSON.stringify(state.categories));
    localStorage.setItem(mirrorKey('suppliers'),  JSON.stringify(state.suppliers));
  }catch(e){}
}
/* Efface toute trace locale du compte courant (à la déconnexion). */
function clearLocalMirror(){
  try{
    if(!window.localStorage) return;
    ['products','movements','categories','suppliers'].forEach(k=>localStorage.removeItem(mirrorKey(k)));
  }catch(e){}
}
// Envoi de l'état complet à Supabase.
// Différence majeure avec l'ancienne version Google : la réponse du serveur
// est LISIBLE. On sait donc vraiment si l'enregistrement a réussi, au lieu
// de le supposer. L'indicateur "Sauvegardé" devient fiable.
let __googleSaveTimer = null;
let __syncDirty = false;      // il y a des modifications pas encore confirmées côté serveur
let __syncing = false;        // un envoi est en cours
let __retryTimer = null;

function setSyncStatus(status){
  // status : 'saved' | 'pending' | 'offline'
  window.__syncStatus = status;
  const el = document.getElementById('sync-indicator');
  if(!el) return;
  if(!cloudReady()){ el.style.display='none'; return; }
  el.style.display='inline-flex';
  if(status==='saved'){
    el.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:#7BD389;display:inline-block;"></span> Sauvegardé';
    el.title = 'Toutes les données sont enregistrées sur le serveur';
  } else if(status==='pending'){
    el.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:#E8B54D;display:inline-block;"></span> Sauvegarde…';
    el.title = 'Enregistrement en cours vers le serveur';
  } else {
    el.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:#D98B6A;display:inline-block;"></span> Hors ligne';
    el.title = 'Pas de connexion : les données sont gardées sur l\'appareil et seront renvoyées automatiquement';
  }
}

async function pushToCloud(){
  if(!cloudReady() || !account) return;
  if(__syncing) return;
  __syncing = true;
  setSyncStatus('pending');
  try{
    const { error } = await withTimeout(
      sb.from(TABLE).upsert({
        user_id: account.userId,
        nom: account.nom || null,
        donnees: currentData(),
        maj_le: new Date().toISOString()
      }, { onConflict:'user_id' }),
      15000
    );
    if(error) throw error;
    window.__lastCloudSave = Date.now();
    __syncDirty = false;
    setSyncStatus('saved');
  }catch(e){
    // Échec (réseau, session expirée…) : on garde le drapeau et on réessaiera.
    console.warn('Envoi impossible', e);
    __syncDirty = true;
    setSyncStatus('offline');
    scheduleRetry();
  }finally{
    __syncing = false;
  }
}
/* Alias : d'anciens appels peuvent encore porter l'ancien nom. */
const pushToGoogle = pushToCloud;
function scheduleRetry(){
  if(__retryTimer) return;
  __retryTimer = setTimeout(()=>{
    __retryTimer = null;
    if(__syncDirty) pushToCloud();
  }, 15000); // réessaie toutes les 15 s tant que non confirmé
}
function scheduleCloudSave(){
  saveLocalMirror();
  if(!cloudReady() || !account) return;
  __syncDirty = true;
  setSyncStatus('pending');
  if(__googleSaveTimer) clearTimeout(__googleSaveTimer);
  __googleSaveTimer = setTimeout(pushToCloud, 600);
}

// Rafraîchissement automatique : on récupère régulièrement les changements faits par les autres.
// On ne rafraîchit PAS si l'utilisateur a des modifications non encore envoyées (pour ne pas les écraser),
// ni si une fenêtre/saisie est ouverte (pour ne pas gêner ce qu'il fait).
async function manualRefresh(btn){
  if(btn){ btn.disabled = true; btn.textContent = '⏳ …'; }

      const { data, error } = await withTimeout(
        sb.from(TABLE).select('donnees').eq('user_id', account.userId).maybeSingle(),
        12000
      );

        saveLocalMirror();
        renderTabs(); renderContent();
        toast("Stock à jour");
        return;
      }
    }
    toast("Impossible de rafraîchir pour le moment");
  }catch(e){
    toast("Pas de connexion : réessayez dans un instant");
  }finally{

  }
}
async function refreshFromCloud(silent){
  if(!cloudReady() || !account) return;
  if(__syncDirty || __syncing) return;               // envoi en attente : on ne touche à rien
  const mr = document.getElementById('modal-root');
  if(mr && mr.innerHTML.trim() !== '') return; // une fenêtre est ouverte : on attend
  try{
    const { data, error } = await withTimeout(
      sb.from(TABLE).select('donnees').eq('user_id', account.userId).maybeSingle(),
      12000
    );
    if(error || !data) return;
    const d = data.donnees || {};
    // Ne réafficher que si quelque chose a réellement changé (évite de faire clignoter l'écran)
    const incoming = JSON.stringify([d.products||[], d.movements||[], d.categories||[], d.suppliers||[]]);
    const current  = JSON.stringify([state.products, state.movements, state.categories, state.suppliers]);
    if(incoming === current){ return; }
    applyData(d);
    saveLocalMirror();
    renderTabs();
    renderContent();
    if(!silent) toast("Stock mis à jour");
  }catch(e){ /* hors ligne : on réessaiera au prochain cycle */ }
}

/* ======================= UTILITAIRES ======================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
/* Date suivie de l'heure. Les mouvements anciens n'ont qu'une date (pas
   d'heure enregistrée) : dans ce cas on n'invente rien, on affiche la date
   seule plutôt qu'un « 00:00 » trompeur. */
function fmtDateHeure(iso){
  if(!iso) return '—';
  if(String(iso).length <= 10){
    const [a,m,j] = String(iso).split('-');
    return (j && m && a) ? `${j}/${m}/${a}` : String(iso);
  }
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})
       + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
/* Conversions pour le champ <input type="datetime-local">, qui travaille en
   heure locale alors que les mouvements sont enregistrés en ISO/UTC. */
function isoVersChamp(iso){
  if(!iso) return '';
  if(String(iso).length <= 10) return String(iso) + 'T00:00';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
}
function champVersIso(v){
  if(!v) return null;
  const d = new Date(v);          // sans fuseau : interprété en heure locale
  return isNaN(d.getTime()) ? null : d.toISOString();
}
function fmtEUR(n){ return (n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}); }
function currentStock(productId){
  let s=0;
  for(const m of state.movements){ if(m.productId===productId){ s += m.type==='in'? m.qty : -m.qty; } }
  return s;
}
function toast(msg){
  const root=document.getElementById('toast-root');

  root.appendChild(el);

}
/* ============ ENREGISTREMENT AUTOMATIQUE : MÉCANIQUE COMMUNE ============
   Chaque fenêtre de saisie peut déposer un "geste de fermeture". Il est
   exécuté quelle que soit la façon dont on referme : bouton Terminé, croix,
   ou clic à côté de la fenêtre. Rien ne peut donc être perdu par mégarde.
   Le geste doit modifier l'état de façon SYNCHRONE (l'envoi au serveur, lui,
   peut être asynchrone), car le contenu de la fenêtre est effacé juste après. */
let __closeHook = null;
function setCloseHook(fn){ __closeHook = fn; }
/* Chaque ouverture de fenêtre incrémente ce compteur. Un enregistrement
   encore en cours sur une fiche déjà refermée ne peut ainsi plus écraser
   le témoin de la fiche suivante. */
let __formGen = 0;
function closeModal(){
  const geste = __closeHook;
  __closeHook = null;
  if(geste){ try{ geste(); }catch(e){ console.warn('fermeture', e); } }
  document.getElementById('modal-root').innerHTML='';
  figeFond(false);
  if(geste){ try{ renderTabs(); renderContent(); }catch(e){} }
}

/* Témoin "Enregistré" affiché au bas d'une fiche. */
function setEtat(id, txt, ok){
  const e = document.getElementById(id);

  e.style.color = ok ? 'var(--green)' : 'var(--ink-soft)';
}
/* Enregistrement différé : on attend une courte pause dans la frappe. */
let __autoTimer = null;
function autoSaveDiffere(fn, temoinId){
  setEtat(temoinId, "Enregistrement…");
  if(__autoTimer) clearTimeout(__autoTimer);
  __autoTimer = setTimeout(fn, 700);
}
function bindAutoSave(ids, fn, temoinId){
  ids.forEach(id=>{
    const el = document.getElementById(id);

}
/* iOS fait défiler la page derrière la fenêtre dès que celle-ci arrive en
   butée. On fige donc le fond pendant l'ouverture, en mémorisant la position
   pour la restituer à la fermeture. */
/* Pendant qu'une fenêtre est ouverte, la page derrière ne doit pas défiler.
   On se contente d'une classe qui coupe le défilement : l'ancienne méthode
   (passer la page en position fixe) déréglait la zone de toucher sur iPhone,
   l'écran montrant un endroit et le doigt en touchant un autre. */
function figeFond(actif){
  try{
    document.documentElement.classList.toggle('fenetre-ouverte', !!actif);
    // Nettoyage des réglages laissés par les versions précédentes.
    const b = document.body;
    if(b.style.position === 'fixed'){
      const y = -parseInt(b.style.top || '0', 10) || 0;
      b.style.position = ''; b.style.top = ''; b.style.left = '';
      b.style.right = ''; b.style.width = '';
      window.scrollTo(0, y);
    }
  }catch(e){}
}

/* Témoin de saisie. Une fenêtre refermée enregistre ce qui a été tapé,
   mais seulement si quelque chose a été tapé : ouvrir puis refermer un
   formulaire pré-rempli ne doit rien créer. */
let __modalTouche = false;
function modalTouche(){ return __modalTouche; }
function openModal(html){
  __formGen++; __modalTouche = false; figeFond(true);
  const racine = document.getElementById('modal-root');
  racine.innerHTML =
  `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closeModal()">✕</button>${html}</div></div>`;
  const marque = ()=>{ __modalTouche = true; };
  racine.addEventListener('input', marque);
  racine.addEventListener('change', marque);
}
function askConfirm(message, onYes){
  window.__confirmYes = onYes;
  openModal(`
    <h3 style="margin-top:6px;">Confirmer</h3>
    <p style="color:var(--ink-soft);font-size:14px;">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="closeModal()">Annuler</button>
      <button class="btn btn-rust" style="flex:1;justify-content:center;" onclick="window.__confirmYes && window.__confirmYes()">Confirmer</button>
    </div>
  `);
}

/* Récupère la session Supabase enregistrée sur l'appareil, s'il y en a une. */
async function restoreSession(){

  try{
    const { data } = await withTimeout(sb.auth.getSession(), 8000);
    const s = data && data.session;
    if(!s || !s.user) return false;
    const meta = s.user.user_metadata || {};
    account = { userId: s.user.id, email: s.user.email, nom: meta.entreprise || meta.nom || s.user.email };
    return true;
  }catch(e){ return false; }
}

/* ---------------- Mot de passe oublié ----------------
   Supabase envoie un lien par e-mail (via Resend). Ce lien ramène sur
   l'application avec les jetons dans le fragment d'URL. Le client est
   configuré avec detectSessionInUrl:false, on les récupère donc à la main
   pour ne rien changer au reste du flux de connexion. */
async function demanderReset(){
  if(!cloudReady()){ loginMsg("Base de données non reliée."); return; }
  const mail = (document.getElementById('login-email').value || '').trim();
  if(!mail){ loginMsg("Indiquez d'abord votre e-mail, puis recliquez sur le lien."); return; }
  const btn = document.getElementById('login-btn');
  if(btn) btn.disabled = true;
  try{
    const retour = window.location.origin + window.location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(mail, { redirectTo: retour });
    if(error) throw error;
    loginMsg("E-mail envoyé. Ouvrez le lien depuis cet appareil pour choisir un nouveau mot de passe.", true);
  }catch(e){ loginMsg(messageAuth(e)); }
  finally{ if(btn) btn.disabled = false; }
}

/* Renvoie true si on vient d'un lien de réinitialisation. */
async function capterLienReset(){
  const brut = String(window.location.hash || '').replace(/^#/, '');
  if(!brut) return false;
  const q = new URLSearchParams(brut);
  const nettoyer = ()=>{
    try{ history.replaceState(null, '', window.location.pathname + window.location.search); }
    catch(e){ try{ window.location.hash = ''; }catch(e2){} }
  };
  if(q.get('error') || q.get('error_description')){
    nettoyer();
    loginMsg("Lien expiré ou déjà utilisé. Demandez-en un nouveau.");
    return false;
  }
  if(q.get('type') !== 'recovery' || !q.get('access_token')) return false;
  try{
    const { error } = await sb.auth.setSession({
      access_token:  q.get('access_token'),
      refresh_token: q.get('refresh_token') || ''
    });
    nettoyer();
    if(error) throw error;
    afficherReset(true);
    return true;
  }catch(e){
    nettoyer(); loginMsg(messageAuth(e)); return false;
  }
}

/* Aiguillage du bouton principal. */
function doAuth(){

}

/* Message d'erreur lisible à partir de la réponse Supabase. */
function messageAuth(e){
  const m = (e && e.message) ? e.message : String(e);
  if(/Invalid login/i.test(m))            return "E-mail ou mot de passe incorrect.";
  if(/already registered|already exists/i.test(m)) return "Un compte existe déjà avec cet e-mail. Utilisez « J'ai déjà un compte ».";
  if(/Password should be/i.test(m))       return "Mot de passe trop court (8 caractères minimum).";
  if(/valid email|invalid format/i.test(m)) return "Adresse e-mail invalide.";
  if(/Signups not allowed|signup is disabled/i.test(m)) return "Les inscriptions sont fermées. Contactez l'administrateur.";
  if(/Email rate limit|over_email_send_rate/i.test(m)) return "Trop de demandes d'e-mail. Réessayez dans une heure.";
  if(/timeout/i.test(m))                  return "Pas de connexion au serveur. Réessayez.";
  return m;
}

/* Création d'un nouveau compte entreprise. */
async function doSignup(){
  if(!cloudReady()){ loginMsg("Application non configurée (Supabase)."); return; }
  const val = id => (document.getElementById(id) ? document.getElementById(id).value : '');
  const entreprise = val('signup-cabinet').trim();
  const email     = val('login-email').trim();
  const pass      = val('login-pass');
  const pass2     = val('signup-pass2');

  if(!entreprise){ loginMsg("Indiquez le nom de l'entreprise"); return; }
  if(!email || email.indexOf('@') === -1){ loginMsg("Adresse e-mail invalide"); return; }
  if(pass.length < 8){ loginMsg("Mot de passe : 8 caractères minimum"); return; }
  if(pass !== pass2){ loginMsg("Les deux mots de passe ne correspondent pas"); return; }
  const souvenirIns = document.getElementById('login-souvenir');
  try{ localStorage.setItem(CLE_SOUVENIR, (souvenirIns && !souvenirIns.checked) ? '0' : '1'); }catch(e){}

  const btn = document.getElementById('login-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Création…'; }
  loginMsg('');
  try{
    const { data, error } = await withTimeout(
      sb.auth.signUp({ email, password: pass, options:{ data:{ entreprise } } }), 25000);
    if(error) throw error;

    if(data && data.session && data.user){
      // Confirmation d'e-mail désactivée : le compte est utilisable tout de suite.
      const u = data.user;
      account = { userId: u.id, email: u.email, nom: entreprise };
      await loadAll();
      if(btn){ btn.disabled = false; btn.textContent = 'Entrer'; }
      authMode = 'login';
      entrerDansApp(nomUtilisateur());
      toast("Compte créé. Bienvenue !");
      return;
    }
    // Confirmation d'e-mail activée : il faut valider le lien reçu.
    if(btn){ btn.disabled = false; btn.textContent = 'Créer le compte'; }
    setAuthMode('login');
    loginMsg("Compte créé. Ouvrez l'e-mail de confirmation, puis connectez-vous ici.", true);
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Créer le compte'; }
    loginMsg(messageAuth(e));
  }
}

async function doLogin(){
  if(!cloudReady()){ loginMsg("Application non configurée (Supabase)."); return; }

  const btn = document.getElementById('login-btn');
  // Pas encore de compte ouvert sur cet appareil : on authentifie.
  if(!account){
    const email = (document.getElementById('login-email').value || '').trim();
    const pass  = (document.getElementById('login-pass').value || '');
    if(!email || !pass){ loginMsg("E-mail et mot de passe requis"); return; }
    // Le choix doit être enregistré AVANT la connexion : c'est lui qui décide
    // où la session sera rangée.
    const souvenir = document.getElementById('login-souvenir');
    try{ localStorage.setItem(CLE_SOUVENIR, (souvenir && !souvenir.checked) ? '0' : '1'); }catch(e){}
    if(btn){ btn.disabled = true; btn.textContent = 'Connexion…'; }
    loginMsg('');
    try{
      const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password: pass }), 20000);
      if(error) throw error;
      const u = data.user; const meta = u.user_metadata || {};
      account = { userId: u.id, email: u.email, nom: meta.entreprise || meta.nom || u.email };
      document.getElementById('login-pass').value = '';
      await loadAll();
    }catch(e){
      account = null;
      loginMsg(messageAuth(e));
      if(btn){ btn.disabled = false; btn.textContent = 'Entrer'; }
      return;
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Entrer'; }
  }
  entrerDansApp(nomUtilisateur());
}

async function saveNomAtelier(silencieux){
  const champ = document.getElementById('na-nom');
  const etat  = document.getElementById('na-etat');
  const btn   = document.getElementById('na-btn');
  const nom = (champ ? champ.value : '').trim();
  const dire = (t, ok)=>{ if(etat){ etat.textContent = t; etat.style.color = ok ? 'var(--green)' : 'var(--rust)'; } };
  if(!nom){ dire("Indiquez un nom", false); return; }
  if(!cloudReady()){ dire("Base de données non reliée", false); return; }
  if(btn) btn.disabled = true;
  try{
    const { error } = await withTimeout(sb.auth.updateUser({ data: { entreprise: nom } }), 12000);
    if(error) throw error;
    if(account) account.nom = nom;
    scheduleCloudSave();
    if(!silencieux){ setCloseHook(null); closeModal(); }
    toast('Nom enregistré');
    const bn = document.getElementById('brand-name');
    if(bn && account) bn.textContent = account.nom || '';

    if(av) av.textContent = (state.user||'').slice(0,2).toUpperCase();

}

/* ========================== LE PANIER ==========================
   Au lieu de valider chaque article un par un, on les accumule dans une
   liste — comme à la caisse d'un magasin — puis on valide l'ensemble.
   Le panier est conservé sur l'appareil : fermer l'application par erreur
   au milieu d'une livraison ne fait rien perdre.
   Un panier par sens : les entrées et les sorties ne se mélangent pas. */
let paniers = { in: [], out: [] };

function panierCle(sens){
  const id = account ? account.userId : 'anonyme';
  return 'stock::' + id + '::panier-' + sens;
}
function chargerPaniers(){
  ['in','out'].forEach(sens=>{
    try{
      const brut = window.localStorage ? localStorage.getItem(panierCle(sens)) : null;
      paniers[sens] = brut ? JSON.parse(brut) : [];
      if(!Array.isArray(paniers[sens])) paniers[sens] = [];
    }catch(e){ paniers[sens] = []; }
  });
}
function enregistrerPanier(sens){
  try{
    if(window.localStorage) localStorage.setItem(panierCle(sens), JSON.stringify(paniers[sens]));
  }catch(e){}
}
function viderPanier(sens){ paniers[sens] = []; enregistrerPanier(sens); }

/* Ajout : si l'article est déjà présent, on incrémente sa ligne. */
function panierAjouter(sens, productId, qte){
  const n = Math.max(1, parseInt(qte,10) || 1);
  const ligne = paniers[sens].find(l=>l.productId===productId);
  if(ligne){ ligne.qty += n; }
  else { paniers[sens].push({ productId, qty:n }); }
  enregistrerPanier(sens);
  return ligne ? ligne.qty : n;
}
function panierModifier(sens, productId, qte){
  const ligne = paniers[sens].find(l=>l.productId===productId);
  if(!ligne) return;
  const n = parseInt(qte,10);
  if(isNaN(n) || n <= 0){ panierRetirer(sens, productId); return; }
  ligne.qty = n;
  enregistrerPanier(sens);
  rafraichirPanier(sens);
}
function panierIncr(sens, productId, delta){
  const ligne = paniers[sens].find(l=>l.productId===productId);
  if(!ligne) return;
  panierModifier(sens, productId, ligne.qty + delta);
}
function panierRetirer(sens, productId){
  paniers[sens] = paniers[sens].filter(l=>l.productId!==productId);
  enregistrerPanier(sens);
  rafraichirPanier(sens);
}
function panierTotal(sens){
  return paniers[sens].reduce((t,l)=>t + l.qty, 0);
}

/* Affichage. On ne redessine que le panier, jamais toute la page :
   sinon le champ de recherche perdrait le focus à chaque scan. */
function panierHTML(sens){
  const lignes = paniers[sens];
  const entree = sens === 'in';
  if(!lignes.length){
    return `<div class="panier"><div class="panier-vide">
      ${entree ? "Scannez ou cherchez les articles reçus : ils s'ajouteront ici."
               : "Scannez ou cherchez les articles à sortir : ils s'ajouteront ici."}
    </div></div>`;
  }
  const corps = lignes.map(l=>{
    const p = state.products.find(x=>x.id===l.productId);
    const nom = p ? (p.name||'') : 'Produit supprimé';
    const dispo = p ? currentStock(p.id) : 0;
    const manque = !entree && l.qty > dispo;
    return `
    <div class="panier-ligne">
      <div class="panier-nom">
        ${esc(nom)}
        <span class="sub ${manque?'manque':''}">
          ${entree ? `stock actuel : ${dispo} ${esc(p?p.unit||'u.':'')}`
                   : manque ? `il n'en reste que ${dispo}` : `reste ${dispo - l.qty} après sortie`}
        </span>
      </div>
      <div class="qte-bloc">
        <button class="qte-btn" onclick="panierIncr('${sens}','${l.productId}',-1)" aria-label="Moins">−</button>
        <button class="qte-val" onclick="ouvrirClavierPanier('${sens}','${l.productId}')" title="Saisir la quantité">${l.qty}</button>
        <button class="qte-btn" onclick="panierIncr('${sens}','${l.productId}',1)" aria-label="Plus">+</button>
        <button class="qte-suppr" onclick="panierRetirer('${sens}','${l.productId}')" aria-label="Retirer">✕</button>
      </div>
    </div>`;
  }).join('');

  const total = panierTotal(sens);
  const insuffisants = entree ? 0 : lignes.filter(l=>{
    const p = state.products.find(x=>x.id===l.productId);
    return !p || l.qty > currentStock(p.id);
  }).length;

  return `
  <div class="panier">
    <div class="panier-tete ${entree?'':'out'}">
      <h4>${entree?'Articles reçus':'Articles à sortir'}</h4>
      <span style="font-size:12.5px;color:var(--ink-soft);">${lignes.length} ligne${lignes.length>1?'s':''} · ${total} article${total>1?'s':''}</span>
    </div>
    ${corps}
    ${insuffisants ? `<div style="padding:10px 12px;background:var(--amber-pale);font-size:12.5px;color:var(--amber);border-top:1px solid var(--border);">
      ${insuffisants} article${insuffisants>1?'s dépassent':' dépasse'} le stock disponible. La validation reste possible : le stock passera en négatif.
    </div>` : ''}
    <div class="panier-pied">
      <button class="btn ${entree?'btn-primary':'btn-rust'}" style="width:100%;justify-content:center;padding:12px;"
        onclick="validerPanier('${sens}')">
        ${entree?'Valider l\'arrivée':'Valider la sortie'} — ${total} article${total>1?'s':''}
      </button>
      <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="demanderViderPanier('${sens}')">Tout effacer</button>
    </div>
  </div>`;
}
function rafraichirPanier(sens){
  const el = document.getElementById('panier-' + sens);
  if(el) el.innerHTML = panierHTML(sens);
}

/* Clavier numérique pour saisir directement une quantité. */
function ouvrirClavierPanier(sens, productId){
  const ligne = paniers[sens].find(l=>l.productId===productId);
  const p = state.products.find(x=>x.id===productId);
  if(!ligne) return;
  openModal(`
    <h3>Quantité — ${esc(p?p.name:'Produit')}</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:-8px;">Actuellement <strong>${ligne.qty}</strong> dans la liste. Entrez la nouvelle quantité.</p>
    <div class="keypad-display" id="adj-display" style="color:#B7C7C2;">0</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="adjPress('${n}')">${n}</button>`).join('')}
      <button onclick="adjPress('back')">⌫</button>
      <button onclick="adjPress('0')">0</button>
      <button style="background:var(--teal);color:#fff;border-color:var(--teal);" onclick="closeModal()">Terminé</button>
    </div>
  `);
  window.__adj = '';
  setCloseHook(()=>{
    const saisie = window.__adj; window.__adj = '';
    if(saisie) panierModifier(sens, productId, parseInt(saisie,10));
  });
}

function demanderViderPanier(sens){
  const n = paniers[sens].length;
  if(!n) return;
  askConfirm(`Effacer les ${n} ligne${n>1?'s':''} de la liste ? Aucun mouvement ne sera enregistré.`, ()=>{
    viderPanier(sens);
    closeModal();
    rafraichirPanier(sens);
    toast("Liste effacée");
  });
}

/* Validation : un mouvement par ligne, enregistré en une seule fois. */
async function validerPanier(sens){
  const lignes = paniers[sens].slice();
  if(!lignes.length){ toast("La liste est vide"); return; }
  const entree = sens === 'in';
  const total = panierTotal(sens);
  const negatifs = entree ? [] : lignes.filter(l=>{
    const p = state.products.find(x=>x.id===l.productId);
    return p && l.qty > currentStock(p.id);
  });
  const message = `Enregistrer ${entree?'l\'arrivée':'la sortie'} de ${total} article${total>1?'s':''} sur ${lignes.length} ligne${lignes.length>1?'s':''} ?`
    + (negatifs.length ? ` ${negatifs.length} produit${negatifs.length>1?'s passeront':' passera'} en stock négatif.` : '');

  askConfirm(message, async ()=>{
    closeModal();
    const maintenant = new Date().toISOString();
    lignes.forEach(l=>{
      if(!state.products.find(x=>x.id===l.productId)) return;   // produit supprimé entre-temps
      state.movements.push({ id:uid(), productId:l.productId, type:sens, qty:l.qty,
        date:maintenant, user:state.user,
        note: entree ? 'Arrivée groupée' : 'Sortie groupée', source:'panier' });
    });
    await saveMovements();
    viderPanier(sens);
    renderTabs(); renderContent();
    toast(`${total} article${total>1?'s':''} ${entree?'ajoutés au':'sortis du'} stock`);
  });
}

/* ===================== ÉCRAN D'ACCUEIL =====================
   Chaque vignette porte un chiffre utile, pour que l'accueil renseigne
   au lieu de n'être qu'un menu de plus à traverser. */
function tuile(id, titre, chemin, chiffre, sous, options){
  const o = options || {};
  return `
  <button class="tuile ${o.alerte?'alerte':''}" onclick="setTab('${id}')">
    ${o.pastille ? `<span class="tuile-pastille">${o.pastille}</span>` : ''}
    <span class="tuile-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${chemin}"/></svg></span>
    <span class="tuile-titre">${titre}</span>
    ${chiffre ? `<span class="tuile-chiffre" ${o.alerte?'style="color:var(--rust);"':''}>${chiffre}</span>` : ''}
    <span class="tuile-sous">${sous}</span>
  </button>`;
}
function viewAccueil(){
  const maintenant = new Date();
  const heure = maintenant.getHours();
  const salut = heure < 18 ? 'Bonjour' : 'Bonsoir';
  const dateTxt = maintenant.toLocaleDateString('fr-FR',
    {weekday:'long', day:'numeric', month:'long'});

  const sousSeuil = state.products.filter(p=>currentStock(p.id) < (p.threshold||0));
  const epuises   = state.products.filter(p=>currentStock(p.id) <= 0).length;
  const valeur    = state.products.reduce((t,p)=>t + currentStock(p.id)*(p.price||0), 0);

  // Activité des 7 derniers jours
  const ilY7j = Date.now() - 7*24*3600*1000;
  const recents = state.movements.filter(m=>new Date(m.date).getTime() >= ilY7j);
  const entrees = recents.filter(m=>m.type==='in').length;
  const sorties = recents.filter(m=>m.type==='out').length;

  // Date du dernier mouvement, en clair
  let dernier = '—';
  if(state.movements.length){
    const d = state.movements.reduce((max,m)=>{
      const t = new Date(m.date).getTime();
      return t > max ? t : max;
    }, 0);
    const jours = Math.floor((Date.now() - d) / (24*3600*1000));
    dernier = jours <= 0 ? "aujourd'hui" : jours === 1 ? 'hier' : `il y a ${jours} jours`;
  }

  const nbFourn = state.suppliers.length;

  return `
  <div style="padding:2px 2px 4px;">
    <div class="accueil-salut">${salut}${state.user ? ', '+esc(state.user) : ''}</div>
    <div class="accueil-date">${dateTxt.charAt(0).toUpperCase()+dateTxt.slice(1)}</div>
  </div>
  <div class="tuiles">
    ${tuile('stock','Stock','M4 7h16M4 12h16M4 17h10',
        sousSeuil.length ? sousSeuil.length : state.products.length,
        sousSeuil.length ? `article${sousSeuil.length>1?'s':''} à commander`
                         : `produit${state.products.length>1?'s':''} · tout est au-dessus du seuil`,
        {alerte: sousSeuil.length>0})}

    ${tuile('production','Production','M5 8h14v11H5V8zm3-4h8v4H8V4zm1 8h6m-6 3h4',
        prodTuileNombre(), prodTuileTexte(), {alerte: prodTuileAlerte()})}

    ${tuile('sortie','Sortie','M12 20V8m0 0l-5 5m5-5l5 5M5 4h14',
        sorties, `sortie${sorties>1?'s':''} ces 7 jours`)}

    ${tuile('arrivee','Arrivée','M12 4v12m0 0l-5-5m5 5l5-5M5 20h14',
        entrees, `entrée${entrees>1?'s':''} ces 7 jours`)}

    ${tuile('produit','Produit','M4 7l8-4 8 4v10l-8 4-8-4V7z',
        state.products.length,
        `fiche${state.products.length>1?'s':''} · ${nbFourn} fournisseur${nbFourn>1?'s':''}`,
        {pastille: epuises ? epuises+' épuisé'+(epuises>1?'s':'') : ''})}

    ${tuile('finance','Finance','M4 19h16M7 19V9m5 10V5m5 14v-7',
        fmtEUR(valeur), 'valeur du stock')}

    ${tuile('historique','Historique','M12 8v5l3 2M4 12a8 8 0 1 1 3 6.3',
        state.movements.length, `mouvements · dernier ${dernier}`)}

    ${tuile('export','Export','M12 3v12m0 0l-4-4m4 4l4-4M5 21h14',
        '', 'Excel, PDF et sauvegarde')}
  </div>`;
}

function renderTabs(){
  const lowCount = state.products.filter(p=>currentStock(p.id) < (p.threshold||0) && currentStock(p.id) > 0).length;
  // La pastille se sert du dernier calcul connu. S'il n'y en a pas, on le
  // lance en arri\u00e8re-plan : appuyer sur un onglet doit r\u00e9pondre tout de suite.
  let prodCount = 0;
  try{
    const c = window.__prodCache;
    if(c && c.val){
      prodCount = c.val.alertes.filter(f=>f.manque > 0).length;
    }else if(!window.__prodCalcule){
      window.__prodCalcule = true;
      setTimeout(()=>{
        try{ prodPlanning(); }catch(e){}
        window.__prodCalcule = false;
        try{ renderTabs(); }catch(e){}
      }, 0);
    }
  }catch(e){ prodCount = 0; }
  document.getElementById('tabs').innerHTML = TABS.map(t=>`
    <button class="tab-btn ${activeTab===t.id?'active':''}" onclick="setTab('${t.id}')" style="position:relative;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="${t.icon}"/></svg>
      ${t.label}
      ${t.id==='stock' && lowCount>0 ? `<span class="tab-badge">${lowCount}</span>`:''}
      ${t.id==='production' && prodCount>0 ? `<span class="tab-badge">${prodCount}</span>`:''}
    </button>`).join('');
}
function setTab(id){ activeTab=id; renderTabs(); renderContent(); }
function setSub(group,id){ activeSub[group]=id; renderContent(); }

function renderContent(){
  // Garde-fou : si plus aucune fenêtre n'est ouverte, le fond doit être rendu
  // au doigt. Sans cela, une fenêtre fermée de travers laisserait toute
  // l'application insensible aux appuis.
  try{
    const mr = document.getElementById('modal-root');
    if(mr && !mr.firstChild) figeFond(false);
  }catch(e){}
  const c = document.getElementById('content');
  try{ renderVue(c); }
  catch(e){
    console.error('Rendu impossible', e);
    c.innerHTML = `<div class="panel"><div class="panel-title"><h2>Affichage impossible</h2></div>
      <p style="font-size:13px;color:var(--ink-soft);line-height:1.5;">
        Cet onglet n'a pas pu s'afficher. Vos données ne sont pas perdues.</p>
      <pre style="font-size:11px;white-space:pre-wrap;color:var(--rust);background:var(--bg);
        border:1px solid var(--border);border-radius:10px;padding:10px;overflow:auto;">${esc(String(e && e.message || e))}</pre>
      <button class="btn btn-outline btn-sm" onclick="setTab('accueil')">Revenir à l'accueil</button></div>`;
  }
}

  openModal(`

    <div class="keypad-display" id="adj-display" style="color:#B7C7C2;">0</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="adjPress('${n}')">${n}</button>`).join('')}
      <button onclick="adjPress('back')">⌫</button>
      <button onclick="adjPress('0')">0</button>
      <button style="background:var(--teal);color:#fff;border-color:var(--teal);" onclick="confirmStockAdjust('${productId}')">Terminé</button>
    </div>
  `);
  window.__adj = '';
  setCloseHook(()=>{

  });

/* Le pavé numérique ne s'enregistre PAS à chaque chiffre : taper "12" pour
   passer de 8 à 12 créerait d'abord une sortie de 7 (le "1"), puis une entrée
   de 11. L'historique se remplirait de corrections fantômes. La valeur n'est
   donc appliquée qu'une fois, au moment où la fenêtre se referme — par le
   bouton Terminé, la croix, ou un clic à côté. */
function appliquerAjustement(productId){
  const saisie = window.__adj;
  window.__adj = '';
  if(!saisie) return false;
  const nouveau = parseInt(saisie, 10);
  if(isNaN(nouveau) || nouveau < 0) return false;
  const diff = nouveau - currentStock(productId);
  if(diff === 0) return false;
  state.movements.push({ id:uid(), productId, type: diff>0?'in':'out', qty: Math.abs(diff),
    date:new Date().toISOString(), user:state.user,
    note:'Correction manuelle du stock', source:'ajustement' });
  saveMovements();
  return true;
}
function adjPress(v){
  if(v==='back') window.__adj = window.__adj.slice(0,-1);
  else if(window.__adj.length<5) window.__adj = (window.__adj==='0'?'':window.__adj) + v;
  const disp = document.getElementById('adj-display');
  disp.textContent = window.__adj || '0';
  disp.style.color = window.__adj ? 'var(--teal-dark)' : '#B7C7C2';
}
function confirmStockAdjust(productId){
  if(!window.__adj){ toast("Entrez le nouveau nombre"); return; }
  closeModal();   // le geste de fermeture applique la valeur
}
function openSortieOptions(productId){
  const p = state.products.find(x=>x.id===productId); const s=currentStock(productId);
  openModal(`

    <p style="color:var(--ink-soft);font-size:13px;margin-top:-8px;">Stock actuel : <strong>${s} ${esc(p.unit||'u.')}</strong></p>

function openKeypad(productId){
  window.__kp = '';
  const render = ()=>`
    <h3>Quantité à retirer</h3>
    <div class="keypad-display" id="kp-display">0</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="kpPress('${n}')">${n}</button>`).join('')}
      <button onclick="kpPress('back')">⌫</button>
      <button onclick="kpPress('0')">0</button>
      <button style="background:var(--teal);color:#fff;border-color:var(--teal);" onclick="kpConfirm('${productId}')">OK</button>
    </div>`;
  openModal(render());

function kpPress(v){
  if(v==='back') window.__kp = window.__kp.slice(0,-1);
  else if(window.__kp.length<5) window.__kp += v;
  document.getElementById('kp-display').textContent = window.__kp || '0';

async function confirmSortie(productId, qty){

  await saveMovements();
  closeModal(); toast(`${qty} article(s) retiré(s) du stock`); renderTabs(); renderContent();
}

async function handleScanCode(rawCode){
  const code = normalizeBarcode(rawCode);
  if(!code) return;
  const dir = window.__scanDir || 'in';
  const product = findProductByBarcode(code);
  const box = document.getElementById('scan-results');
  if(!box) return;
  if(product){
    // On n'enregistre rien tout de suite : l'article rejoint la liste,
    // et un second scan du même article incrémente simplement sa ligne.
    const qte = panierAjouter(dir, product.id, 1);
    rafraichirPanier(dir);
    const s = currentStock(product.id);
    const alerte = dir==='out' && qte > s;
    box.innerHTML = `<div class="panel" style="padding:11px 12px;background:${alerte?'var(--amber-pale)':(dir==='in'?'var(--teal-pale)':'var(--rust-pale)')};border:none;margin-bottom:8px;">
      <strong>${esc(product.name)}</strong> — ajouté à la liste (×${qte})<br>
      <span style="font-size:13px;color:${alerte?'var(--amber)':'var(--ink-soft)'};">
        ${alerte ? `Attention : il n'en reste que ${s} en stock.` : `Stock actuel : ${s} ${esc(product.unit||'u.')}`}
      </span>
    </div>` + box.innerHTML;
  } else {
    box.innerHTML = `<div class="panel" style="padding:12px;background:var(--amber-pale);border:none;margin-bottom:8px;">
      <strong>Code inconnu : ${esc(code)}</strong>
      <p style="font-size:13px;color:var(--ink-soft);margin:6px 0 8px 0;">Associez-le à un produit existant pour le reconnaître la prochaine fois.</p>
      <select id="scan-assign-${esc(code)}" style="margin-bottom:8px;">
        <option value="">— Choisir un produit —</option>
        ${state.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
      </select>
      <button class="btn btn-primary btn-sm" style="width:100%;justify-content:center;" onclick="assignBarcode('${esc(code)}')">Associer ce code au produit</button>
    </div>` + box.innerHTML;
  }
}
async function assignBarcode(code){
  const sel = document.getElementById('scan-assign-'+code);
  const pid = sel ? sel.value : '';
  if(!pid){ toast("Choisissez un produit"); return; }
  const p = state.products.find(x=>x.id===pid);
  if(p){ p.barcode = normalizeBarcode(code); await saveProducts(); toast("Code associé à "+p.name); renderContent(); }
}
async function startCameraScan(){
  const box = document.getElementById('scan-camera-box');
  box.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);"><span class="spinner" style="border-color:rgba(18,101,92,0.3);border-top-color:var(--teal);"></span> Ouverture de la caméra…</p>`;
  try{

      <p style="font-size:12px;color:var(--ink-soft);text-align:center;margin:6px 0;">Visez le code-barres ou le QR code</p>
      <button class="btn btn-outline btn-sm" style="width:100%;justify-content:center;" onclick="stopCameraScan()">Arrêter la caméra</button>`;
    const video = document.getElementById('scan-video');

    video.setAttribute('playsinline', true);
    await video.play();
    window.__scanStream = stream;
    startZxingScan(video);

function stopCameraScan(){
  window.__scanActive = false;
  if(window.__zxingReader){ try{ window.__zxingReader.reset(); }catch(e){} window.__zxingReader=null; }
  if(window.__scanStream){ window.__scanStream.getTracks().forEach(t=>t.stop()); window.__scanStream=null; }
  const box = document.getElementById('scan-camera-box');
  if(box) box.innerHTML = '';
}
function startZxingScan(video){
  window.__scanActive = true;
  // ZXing : lit codes-barres 1D (EAN, Code128…) ET QR codes
  if(typeof ZXing !== 'undefined' && ZXing.BrowserMultiFormatReader){
    try{
      const reader = new ZXing.BrowserMultiFormatReader();
      window.__zxingReader = reader;
      reader.decodeFromVideoDevice(null, video, (result, err)=>{
        if(result && window.__scanActive){
          const text = result.getText ? result.getText() : (result.text||'');
          if(text){ stopCameraScan(); handleScanCode(text); }
        }
      });
      return;
    }catch(e){ /* repli sur jsQR */ }
  }
  // Repli : jsQR (QR uniquement)
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const tick = ()=>{
    if(!window.__scanActive || !window.__scanStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR!=='undefined'){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      try{
        const img = ctx.getImageData(0,0,canvas.width,canvas.height);
        const result = jsQR(img.data, img.width, img.height);
        if(result && result.data){ stopCameraScan(); handleScanCode(result.data); return; }
      }catch(e){}
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function resizeImageFile(file, maxW=1300, quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function isClaudeEnvAvailable(){
  // L'API IA n'est joignable que si l'app tourne dans l'environnement Claude (utilisateur connecté).
  return (typeof window !== 'undefined') && window.location && /claude\.ai|anthropic/.test(window.location.hostname || '');
}
async function callClaude(promptText, attachment){
  if(!isClaudeEnvAvailable()){
    throw new Error("IA_INDISPONIBLE");
  }
  const content = [];
  if(attachment){
    const base64 = attachment.dataUrl.split(',')[1];
    content.push({type: attachment.kind, source:{type:'base64', media_type: attachment.mediaType, data: base64}});
  }
  content.push({type:'text', text: promptText});
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:2000, messages:[{role:'user', content}]})
    });
  }catch(e){ throw new Error('[requête] '+(e.message||e)); }
  let raw;
  try{ raw = await res.text(); }catch(e){ throw new Error('[lecture, statut '+res.status+'] '+(e.message||e)); }
  let data;
  if(!raw || raw.trim()===''){ throw new Error('[format, statut '+res.status+'] réponse vide reçue du serveur — réessayez'); }
  try{ data = JSON.parse(raw); }catch(e){ throw new Error('[format, statut '+res.status+'] contenu illisible : '+raw.slice(0,300)); }
  if(!res.ok || data.type==='error'){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data).slice(0,300);
    throw new Error('[api, statut '+res.status+'] '+msg);
  }
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('[contenu] '+JSON.stringify(data).slice(0,300));
  return textBlock.text;
}
async function callClaudeWithRetry(promptText, attachment, attempts=3){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{ return await callClaude(promptText, attachment); }
    catch(e){ lastErr=e; if(i<attempts-1) await new Promise(r=>setTimeout(r,1200)); }
  }
  throw lastErr;
}
function extractJSON(text){
  const cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  const start = cleaned.indexOf('[')>=0 && (cleaned.indexOf('{')<0 || cleaned.indexOf('[')<cleaned.indexOf('{')) ? cleaned.indexOf('[') : cleaned.indexOf('{');
  try{ return JSON.parse(cleaned.slice(start)); }catch(e){ try{ return JSON.parse(cleaned);}catch(e2){ return null; } }
}

function normalizeText(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function similarity(a, b){
  const na = normalizeText(a), nb = normalizeText(b);
  if(!na || !nb) return 0;
  if(na===nb) return 1;
  const wa = new Set(na.split(' ')), wb = new Set(nb.split(' '));
  let common = 0;
  wa.forEach(w=>{ if(wb.has(w)) common++; });
  const wordScore = (2*common) / (wa.size + wb.size);
  const substrBonus = (na.includes(nb) || nb.includes(na)) ? 0.2 : 0;
  return Math.min(1, wordScore + substrBonus);
}
function findDuplicateCandidate(name, excludeId){
  let best = null, bestScore = 0;
  for(const p of state.products){
    if(p.id===excludeId) continue;
    const s = similarity(name, p.name);
    if(s > bestScore){ bestScore = s; best = p; }
  }
  if(best && bestScore >= 0.45) return {id: best.id, score: bestScore};
  return null;
}
function findAllDuplicatePairs(){
  const pairs = [];
  const seen = new Set();
  for(let i=0;i<state.products.length;i++){
    for(let j=i+1;j<state.products.length;j++){
      const a = state.products[i], b = state.products[j];
      const key = [a.id,b.id].sort().join('|');
      if(seen.has(key)) continue;
      const s = similarity(a.name, b.name);
      if(s >= 0.45){
        seen.add(key);
        pairs.push({aId:a.id, bId:b.id, score:s});
      }
    }
  }
  pairs.sort((x,y)=>y.score-x.score);
  return pairs;
}
function runDuplicateAudit(){

async function mergeProducts(keepId, removeId){
  const keep = state.products.find(p=>p.id===keepId);
  const remove = state.products.find(p=>p.id===removeId);
  if(!keep || !remove) return;
  askConfirm("Fusionner ces deux fiches ? Les informations manquantes de la fiche prioritaire seront complétées par l'autre, et le stock + l'historique seront additionnés. Cette action est irréversible.", async ()=>{
    // Combiner : la fiche prioritaire garde ses valeurs, mais tout champ vide est complété par l'autre
    const fields = ['supplier','supplierRef','wholesaler','wholesalerRef','barcode','category','unit','photo'];
    fields.forEach(f=>{
      const kv = keep[f], rv = remove[f];
      const kEmpty = kv===undefined || kv===null || String(kv).trim()==='';
      if(kEmpty && rv!==undefined && rv!==null && String(rv).trim()!=='') keep[f] = rv;
    });
    // Prix : garder celui de la fiche prioritaire s'il est renseigné, sinon celui de l'autre
    if((!keep.price || keep.price===0) && remove.price) keep.price = remove.price;
    // Seuil : garder le plus élevé des deux (plus prudent)
    keep.threshold = Math.max(keep.threshold||0, remove.threshold||0);
    // Transférer l'historique (donc le stock s'additionne automatiquement)
    state.movements.forEach(m=>{ if(m.productId===removeId) m.productId = keepId; });
    state.products = state.products.filter(p=>p.id!==removeId);
    await saveProducts(); await saveMovements();
    closeModal(); toast("Fiches fusionnées"); renderTabs();
    renderDuplicateAudit();
  });
}
