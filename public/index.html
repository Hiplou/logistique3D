/* Semaine type : autant de plages que l'on veut par jour. */
function prodRenderPlan(){
  const box = document.getElementById('pl-plan');
  if(!box) return;
  const P = window.__prodPlan || {};
  box.innerHTML = [1,2,3,4,5,6,0].map(j=>{
    const l = P[j] || [];
    return `<div style="border-bottom:1px solid var(--border);padding:8px 0;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${l.length?'6px':'0'};">
        <span style="font-size:12.5px;font-weight:600;color:${l.length?'var(--ink)':'var(--ink-soft)'};">${JOURS[j]}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          ${l.length?'':'<span style="font-size:11.5px;color:var(--ink-soft);">absent</span>'}
          <button class="btn btn-outline btn-sm" style="padding:3px 10px;" onclick="prodAjoutPlage(${j})">+</button>
        </span>
      </div>
      ${l.map((pl,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
        <input type="time" value="${esc(pl.de||'')}" style="flex:1;min-width:0;" onchange="prodMajPlage(${j},${i},'de',this.value)">
        <input type="time" value="${esc(pl.a||'')}" style="flex:1;min-width:0;" onchange="prodMajPlage(${j},${i},'a',this.value)">
        <button class="btn btn-ghost btn-sm" onclick="prodSupprPlage(${j},${i})">\u2715</button>
      </div>`).join('')}
    </div>`;
  }).join('');
}
function prodAjoutPlage(j){
  const P = window.__prodPlan = window.__prodPlan || {};
  const l = P[j] = P[j] || [];
  const derniere = l[l.length-1];
  if(derniere && (!derniere.de || !derniere.a)){
    toast('Compl\u00e9tez la plage en cours avant d\'en ajouter une');
    return;
  }
  l.push(l.length ? {de:'14:00', a:'18:00'} : {de:'09:00', a:'19:00'});
  prodRenderPlan();
}
function prodMajPlage(j, i, champ, val){
  const l = (window.__prodPlan||{})[j]; if(!l || !l[i]) return;
  l[i][champ] = val;
}
function prodSupprPlage(j, i){
  const l = (window.__prodPlan||{})[j]; if(!l) return;
  l.splice(i, 1); prodRenderPlan();
}

function prodRenderExc(){
  const box = document.getElementById('pl-exc'); if(!box) return;
  const L = window.__prodExc || [];
  if(!L.length){ box.innerHTML = `<p class="prod-note">Aucune date particulière.</p>`; return; }
  box.innerHTML = L.map((e,i)=>`
    <div style="border:1px solid var(--border);border-radius:10px;padding:9px;margin-bottom:8px;">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
        <input type="date" value="${esc(e.du||'')}" style="flex:1;min-width:0;" onchange="prodMajExc(${i},'du',this.value)">
        <span style="font-size:12px;color:var(--ink-soft);">au</span>
        <input type="date" value="${esc(e.au||e.du||'')}" style="flex:1;min-width:0;" onchange="prodMajExc(${i},'au',this.value)">
        <button class="btn btn-ghost btn-sm" onclick="prodSupprExc(${i})">✕</button>
      </div>
      <div class="checkline" style="margin:0 0 6px 0;">
        <input type="checkbox" id="pl-ex-o-${i}" ${e.ouvert?'checked':''} onchange="prodMajExc(${i},'ouvert',this.checked)">
        <label for="pl-ex-o-${i}" style="margin:0;text-transform:none;font-weight:500;color:var(--ink-soft);">Présent, mais à d'autres horaires</label>
      </div>
      ${e.ouvert?`<div style="display:flex;gap:8px;margin-bottom:6px;">
        <input type="time" value="${esc(e.de||'10:00')}" style="flex:1;min-width:0;" onchange="prodMajExc(${i},'de',this.value)">
        <input type="time" value="${esc(e.a||'18:00')}" style="flex:1;min-width:0;" onchange="prodMajExc(${i},'a',this.value)">
      </div>`:''}
      <input type="text" value="${esc(e.motif||'')}" placeholder="Congés, salon, jour férié…" onchange="prodMajExc(${i},'motif',this.value)">
    </div>`).join('');
}
function prodAjoutExc(){
  window.__prodExc = window.__prodExc || [];
  window.__prodExc.push({du:todayISO(), au:todayISO(), ouvert:false, de:'10:00', a:'18:00', motif:''});
  prodRenderExc();
}
function prodMajExc(i, champ, val){
  const L = window.__prodExc || []; if(!L[i]) return;
  L[i][champ] = val;
  if(champ === 'du' && (!L[i].au || L[i].au < val)) L[i].au = val;
  if(champ === 'ouvert') prodRenderExc();
}
function prodSupprExc(i){ (window.__prodExc||[]).splice(i,1); prodRenderExc(); }
function prodAppliqueLieu(silencieux){
  const champ = document.getElementById('pl-nom');
  if(!champ) return false;
  const nom = champ.value.trim();
  if(!nom){ if(!silencieux) toast('Donnez un nom au lieu'); return false; }
  const P = window.__prodPlan || {};
  const planning = {};
  for(let j = 0; j <= 6; j++)
    planning[j] = (P[j]||[]).filter(x=>x && x.de && x.a && x.a > x.de).map(x=>({de:x.de, a:x.a}));
  const exceptions = (window.__prodExc||[]).filter(e=>e.du);
  state.sites = state.sites || [];
  const ex = window.__prodLieu ? prodLieu(window.__prodLieu) : null;
  if(ex) Object.assign(ex, {nom, planning, exceptions});
  else state.sites.push({id:uid(), nom, planning, exceptions});
  window.__prodLieu = null; window.__prodExc = []; window.__prodPlan = null;
  scheduleCloudSave();
  return true;
}
async function prodSaveLieu(){
  if(!prodAppliqueLieu(false)) return;
  setCloseHook(null);
  closeModal(); toast('Lieu enregistr\u00e9'); renderContent();
}

function prodSupprLieu(id){
  setCloseHook(null); window.__prodLieu = null;
  askConfirm("Supprimer ce lieu ? Ses imprimantes seront rattachées au premier lieu restant.", async ()=>{
    state.sites = (state.sites||[]).filter(s=>s.id!==id);
    prodMigration();
    (state.printers||[]).forEach(p=>{ if(p.siteId === id) p.siteId = (state.sites[0]||{}).id; });
    scheduleCloudSave(); closeModal(); toast('Lieu supprimé'); renderContent();
  });
}

/* ------------------------------ ARTICLES ------------------------------ */
function prodDuree(min){
  const m = Math.round(Number(min)||0);
  if(!m) return '0 min';
  const h = Math.floor(m/60), r = m%60;
  return (h?`${h} h`:'') + (h&&r?' ':'') + (r?`${r} min`:'');
}
/* Cat\u00e9gories propres aux articles de production. Elles ne sont pas celles
   du stock : on classe ici des recettes d'impression, pas des produits. */
function prodCats(){ return state.artCats || (state.artCats = []); }
function prodCat(id){ return prodCats().find(c=>c.id === id) || null; }

function viewProdArticles(){
  const vue = activeSub.articles || 'liste';
  const onglets = `<div class="subtabs" style="margin-bottom:12px;">

      <div class="prod-row-sub">${prodDuree(r.minutesPiece)} par impression${pp>1?`, ${pp} pi\u00e8ces \u00e0 la fois`:''} \u00b7 ${m?`${m} imprimante${m>1?'s':''}`:'aucune imprimante'}</div>
      <div class="prod-row-sub">${fini ? `Valid\u00e9e, la pi\u00e8ce entre en stock sous \u00ab ${esc(fini.name)} \u00bb` : 'Aucun produit fini reli\u00e9'}</div>
    </div>`;
  }).join('') : `<div class="empty">Aucun article. Un article, c'est la recette d'impression d'une pi\u00e8ce : sa bobine, son rendement, sa dur\u00e9e.</div>`;

  const bobines = (state.products||[]).filter(p=>p.category === 'Filament 3D')

  return `<div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="prodOpenArticle()">Nouvel article</button>

async function prodSaveBobine(){

/* silencieux : appelé à la fermeture de la fenêtre. */
function prodAppliqueBobine(silencieux){
  if(silencieux && !modalTouche()) return false;
  const val = id => { const e = document.getElementById(id); return e ? String(e.value||'').trim() : ''; };
  const delai = val('pb-delai') === '' ? null : Math.max(0, parseInt(val('pb-delai'), 10) || 0);
  const prix  = parseFloat(val('pb-prix').replace(',', '.')) || 0;
  const seuil = parseInt(val('pb-seuil'), 10) || 0;
  const fourn = val('pb-fourn');
  const exist = window.__prodBobine ? (state.products||[]).find(p=>p.id === window.__prodBobine) : null;

  if(exist){
    const nom = val('pb-nom');
    if(!nom){ if(!silencieux) toast('Indiquez un nom'); return false; }
    Object.assign(exist, {name:nom, supplier:fourn, price:prix, threshold:seuil, delaiJours:delai});
  }else{
    const mat = val('pb-mat'), coul = val('pb-coul');
    const nom = val('pb-nom') || [mat, coul].filter(Boolean).join(' ');
    if(!nom){ if(!silencieux) toast('Choisissez une mati\u00e8re ou saisissez un nom'); return false; }
    if(!(state.categories||[]).some(x=>x.name === 'Filament 3D'))
      (state.categories = state.categories || []).push({name:'Filament 3D', color:'#1B3FB0'});
    const prod = {id: uid(), name: nom, category: 'Filament 3D',
                  supplier: fourn || 'Bambu Lab', supplierRef: '',
                  price: prix, threshold: seuil, unit: 'bobine', photo: null, delaiJours: delai};
    state.products.push(prod);
    const qte = parseInt(val('pb-qte'), 10) || 0;
    if(qte > 0) state.movements.push({
      id: uid(), productId: prod.id, type: 'in', qty: qte,
      date: new Date().toISOString(), user: state.user || null,
      source: 'manuel', note: 'Cr\u00e9ation de la bobine'
    });
  }

  window.__prodBobine = null;
  scheduleCloudSave();
  if(!silencieux) toast(exist ? 'Bobine enregistr\u00e9e' : 'Bobine cr\u00e9\u00e9e');
  return true;
}

/* Enregistre la fiche. silencieux = appel\u00e9 \u00e0 la fermeture de la fen\u00eatre. */
function prodAppliqueArticle(silencieux){
  const champ = document.getElementById('pa-nom');
  if(!champ) return false;
  const nom = champ.value.trim();
  const minutes = prodDureeLue('pa-duree');
  if(!nom || minutes <= 0){
    if(!silencieux) toast(!nom ? "Donnez un nom \u00e0 l'article" : "Indiquez la dur\u00e9e d'une impression");
    return false;
  }
  const ids = [];
  (state.printers||[]).forEach(m=>{
    const cle = 'pa-mod-' + String(m.modele || 'Sans mod\u00e8le').replace(/[^A-Za-z0-9]/g,'_');
    const c = document.getElementById(cle);
    if(c && c.checked) ids.push(m.id);
  });
  // Produit fini : celui qui recevra les pieces validees.
  let fini = (document.getElementById('pa-fini')||{}).value || '';
  if(fini === '__creer'){
    const dejaLa = state.products.find(pp=>pp.name === nom);
    if(dejaLa) fini = dejaLa.id;
    else{
      const cat = (state.categories||[]).find(c=>c.name !== 'Filament 3D');
      const neuf = {id:uid(), name:nom, category:(cat?cat.name:'Autre'), supplier:'',
                    supplierRef:'', price:0, threshold:0, unit:'piece', photo:null};
      state.products.push(neuf);
      fini = neuf.id;
      if(!silencieux) toast('Produit fini cree dans le stock');
    }
  }
  const donnees = {
    nom,
    catId: (document.getElementById('pa-cat')||{}).value || null,
    produitFiniId: fini || null,
    filamentId: (document.getElementById('pa-fil')||{}).value || null,
    piecesParBobine: Math.max(1, parseInt((document.getElementById('pa-rend')||{}).value, 10) || 1),
    piecesParImpression: Math.max(1, parseInt((document.getElementById('pa-lot')||{}).value, 10) || 1),
    minutesPiece: minutes,
    manipMinutes: prodDureeLue('pa-manip'),
    printerIds: ids
  };
  state.recipes = state.recipes || [];
  const ex = window.__prodArticle ? prodRecette(window.__prodArticle) : null;
  if(ex){ Object.assign(ex, donnees); window.__prodDernierArticle = ex.id; }
  else { const neuf = Object.assign({id:uid()}, donnees); state.recipes.push(neuf); window.__prodDernierArticle = neuf.id; }
  window.__prodArticle = null;
  scheduleCloudSave();
  return true;
}

async function prodSaveArticle(){
  if(!prodAppliqueArticle(false)) return;
  setCloseHook(null);
  closeModal(); toast('Article enregistr\u00e9'); renderContent();
}

function prodSupprArticle(id){
  setCloseHook(null); window.__prodArticle = null;
  askConfirm("Supprimer cet article ? Les commandes qui l'utilisent perdront cette ligne.", async ()=>{
    state.recipes = (state.recipes||[]).filter(r=>r.id!==id);
    (state.orders||[]).forEach(o=>{ o.lignes = (o.lignes||[]).filter(l=>l.recipeId!==id); });
    scheduleCloudSave(); closeModal(); toast('Article supprimé'); renderContent();
  });

function prodRenderLignes(){
  const box = document.getElementById('pc-lignes'); if(!box) return;
  const rec = state.recipes || [];
  if(!rec.length){ box.innerHTML = `<p class="prod-note">Cr\u00e9ez d'abord un article dans l'onglet Articles.</p>`; return; }
  const L = window.__prodLignes || [];
  if(!L.length){ box.innerHTML = `<p class="prod-note">Aucune pi\u00e8ce pour l'instant.</p>`; prodRenderTotal(); return; }

  box.innerHTML = L.map((l,i)=>{
    const total = (Number(l.qte)||0) * (Number(l.prix)||0);
    return `<div style="border:1px solid var(--border);border-radius:10px;padding:9px;margin-bottom:8px;">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:7px;">
        <select style="flex:1;min-width:0;" onchange="prodMajLigne(${i},'recipeId',this.value)">

        <button class="btn btn-ghost btn-sm" onclick="prodSupprLigne(${i})">\u2715</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span style="font-size:11.5px;color:var(--ink-soft);flex:none;">Qt\u00e9</span>
        <input type="text" inputmode="numeric" pattern="[0-9]*" style="width:54px;flex:none;text-align:center;"
               value="${esc(l.qte)}" onchange="prodMajLigne(${i},'qte',this.value)">
        <span style="font-size:11.5px;color:var(--ink-soft);flex:none;">Prix unitaire</span>
        <input type="text" inputmode="decimal" style="flex:1;min-width:0;text-align:right;"
               value="${l.prix != null && l.prix !== '' ? esc(l.prix) : ''}" onchange="prodMajLigne(${i},'prix',this.value)">
      </div>
      ${total ? `<div class="prod-row-sub" style="text-align:right;margin-top:5px;">${fmtEUR(total)}</div>` : ''}
    </div>`;
  }).join('');
  prodRenderTotal();

/* Total affich\u00e9 sous les lignes, recalcul\u00e9 \u00e0 chaque saisie. */
function prodRenderTotal(){
  const box = document.getElementById('pc-total'); if(!box) return;
  const base = document.getElementById('pc-base');
  const tvaEl = document.getElementById('pc-tva');
  const t = prodTotal({
    lignes: window.__prodLignes || [],
    prixTTC: base ? base.value === 'ttc' : false,
    tva: tvaEl ? tvaEl.value : 20
  });
  box.innerHTML = t.saisi
    ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);">
         <span>Total hors taxes</span><span>${fmtEUR(t.ht)}</span></div>
       <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:600;color:var(--ink);margin-top:3px;">
         <span>Total TTC</span><span>${fmtEUR(t.ttc)}</span></div>`
    : `<p class="prod-note" style="margin:0;">Renseignez un prix unitaire pour obtenir le total.</p>`;
}

function prodAjoutLigne(){
  const rec = state.recipes || [];
  if(!rec.length){ toast("Créez d'abord un article"); return; }
  window.__prodLignes = window.__prodLignes || [];
  const r0 = rec[0];
  const fini = r0 ? state.products.find(pp=>pp.id === r0.produitFiniId) : null;
  window.__prodLignes.push({recipeId: r0.id, qte: 1, prix: (fini && fini.price) || ''});
  prodRenderLignes();
}
function prodMajLigne(i, champ, val){
  const L = window.__prodLignes || []; if(!L[i]) return;
  if(champ === 'qte')       L[i].qte  = Math.max(1, parseInt(val,10) || 1);
  else if(champ === 'prix') L[i].prix = String(val||'').replace(',', '.').replace(/[^0-9.]/g,'');
  else{
    L[i][champ] = val;
    const r = prodRecette(val);
    const fini = r ? state.products.find(pp=>pp.id === r.produitFiniId) : null;
    if(!L[i].prix && fini && fini.price) L[i].prix = fini.price;
  }
  prodRenderLignes();
}
function prodSupprLigne(i){ (window.__prodLignes||[]).splice(i,1); prodRenderLignes(); }
function prodAppliqueCommande(silencieux){
  const dateEl = document.getElementById('pc-date');
  if(!dateEl) return false;
  const date = dateEl.value;
  const L = (window.__prodLignes||[]).filter(l=>l.recipeId && Number(l.qte) > 0)
    .map(l=>({recipeId:l.recipeId, qte:Number(l.qte)||1, prix:Number(l.prix)||0}));
  if(!date || !L.length){
    if(!silencieux) toast(!date ? 'Indiquez la date de livraison' : 'Ajoutez au moins une pi\u00e8ce');
    return false;
  }
  const f = document.getElementById('pc-fait');
  const baseEl = document.getElementById('pc-base');
  const tvaEl  = document.getElementById('pc-tva');
  const d = {
    client: (document.getElementById('pc-client')||{}).value.trim(),
    dateLivraison: date, lignes: L,
    prixTTC: baseEl ? baseEl.value === 'ttc' : false,
    tva: tvaEl && isFinite(parseFloat(String(tvaEl.value).replace(',','.')))
         ? parseFloat(String(tvaEl.value).replace(',','.')) : 20,
    note: (document.getElementById('pc-note')||{}).value.trim(),
    fait: f ? f.checked : false
  };
  state.orders = state.orders || [];
  const ex = window.__prodCmd ? state.orders.find(o=>o.id===window.__prodCmd) : null;
  if(ex){ const garde = {livree:ex.livree, livreeLe:ex.livreeLe}; Object.assign(ex, d, garde); }
  else state.orders.push(Object.assign({id:uid()}, d));
  window.__prodCmd = null; window.__prodLignes = [];
  scheduleCloudSave();
  return true;
}
async function prodSaveCommande(){
  if(!prodAppliqueCommande(false)) return;
  setCloseHook(null);
  closeModal(); toast('Commande enregistr\u00e9e'); renderContent();
}

function prodSupprCommande(id){
  setCloseHook(null); window.__prodCmd = null;
  askConfirm('Supprimer cette commande ?', async ()=>{
    state.orders = (state.orders||[]).filter(o=>o.id!==id);
    scheduleCloudSave(); closeModal(); toast('Commande supprimée'); renderContent();
  });
}

/* ------------------------------ RÉGLAGES ------------------------------ */
function prodOpenReglages(){
  const c = prodConf();
  openModal(`
    <h3>Réglages de production</h3>
    <div class="field"><label>Jours pour recevoir une bobine — valeur par défaut</label>
      <input type="text" id="pr-fourn" inputmode="numeric" pattern="[0-9]*" value="${c.delaiFournisseur}"></div>
    <div class="field"><label>Jours entre la fin de fabrication et le client</label>
      <input type="text" id="pr-exp" inputmode="numeric" pattern="[0-9]*" value="${c.delaiExpedition}"></div>
    <div class="field"><label>Minutes pour vider un plateau et relancer</label>
      <input type="text" id="pr-manip" inputmode="numeric" pattern="[0-9]*" value="${c.manipulation}"></div>
    <div class="field"><label>Bobines gardées en réserve</label>
      <input type="text" id="pr-marge" inputmode="numeric" pattern="[0-9]*" value="${c.margeBobines}"></div>
    <div class="field"><label>Montant minimum d'une commande fournisseur, en euros</label>
      <input type="text" id="pr-mini" inputmode="decimal" value="${c.montantMini || ''}"></div>
    <div class="modal-actions"><button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="prodSaveReglages()">Enregistrer</button></div>
  `);
  setCloseHook(()=>prodAppliqueReglages());
}
function prodAppliqueReglages(){
  const v = id => { const e = document.getElementById(id); return e ? parseInt(e.value,10) : NaN; };
  if(isNaN(v('pr-fourn')) && isNaN(v('pr-exp')) && isNaN(v('pr-manip')) && isNaN(v('pr-marge'))) return false;
  const marge = v('pr-marge');
  state.prod = {
    delaiFournisseur: Math.max(0, v('pr-fourn') || 10),
    delaiExpedition:  Math.max(0, v('pr-exp')   || 6),
    manipulation:     Math.max(1, v('pr-manip') || 10),
    margeBobines:     isNaN(marge) ? 1 : Math.max(0, marge),
    montantMini:      Math.max(0, parseFloat(String((document.getElementById('pr-mini')||{}).value || '').replace(',','.')) || 0)
  };
  scheduleCloudSave();
  return true;
}
async function prodSaveReglages(){
  prodAppliqueReglages(); setCloseHook(null);
  closeModal(); toast('R\u00e9glages enregistr\u00e9s'); renderContent();
}
