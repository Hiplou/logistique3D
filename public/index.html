async function confirmBonItems(){
  const date = new Date().toISOString();
  const target = window.__bonTarget || 'bon-results';
  const src = target==='pdf-results' ? 'PDF' : 'photo';
  const f = window.__bonSupplier || {};
  let supplierName = (f.nom||'').trim();

  if(supplierName){
    let sup = state.suppliers.find(s=>s.name.toLowerCase()===supplierName.toLowerCase());
    if(!sup){
      sup = {id:uid(), name:supplierName, email:f.email||'', phone:f.telephone||'', address:f.adresse||'', iban:f.iban||'',
        contactFirstName:f.commercial_prenom||'', contactLastName:f.commercial_nom||'', contactPhone:f.commercial_telephone||'', contactEmail:f.commercial_email||''};
      state.suppliers.push(sup);
    } else {
      sup.email = sup.email || f.email || '';
      sup.phone = sup.phone || f.telephone || '';
      sup.address = sup.address || f.adresse || '';
      sup.iban = sup.iban || f.iban || '';
      sup.contactFirstName = sup.contactFirstName || f.commercial_prenom || '';
      sup.contactLastName = sup.contactLastName || f.commercial_nom || '';
      sup.contactPhone = sup.contactPhone || f.commercial_telephone || '';
      sup.contactEmail = sup.contactEmail || f.commercial_email || '';
    }
    await saveSuppliers();
  }

  for(const it of window.__bonItems){
    let pid = it.productId;
    if(!pid){
      const np = {id:uid(), name: it.nom||'Article sans nom', category:'Autre', supplier: supplierName, supplierRef: it.reference||'', price: parseFloat(it.prix_unitaire)||0, threshold:5, unit:'u.', photo:null};
      state.products.push(np); pid = np.id;
    } else if(supplierName){
      const p = state.products.find(x=>x.id===pid);
      if(p && !p.supplier) p.supplier = supplierName;
    }
    state.movements.push({id:uid(), productId:pid, type:'in', qty: parseInt(it.quantite,10)||1, date, user:state.user, note:'Bon de livraison ('+src+')'+(window.__bonMeta&&window.__bonMeta.numero?' n°'+window.__bonMeta.numero:''), source: src==='PDF'?'pdf':'photo'});
  }
  await saveProducts(); await saveMovements();
  document.getElementById(target).innerHTML='';
  if(document.getElementById('bon-preview')) document.getElementById('bon-preview').innerHTML='';
  if(document.getElementById('pdf-preview')) document.getElementById('pdf-preview').innerHTML='';
  toast("Réception ajoutée au stock"); renderTabs();
}

/* ---- Photo d'un article isolé (arrivée ou reconnaissance) ---- */
async function handleArticlePhoto(ev, direction){
  const file = ev.target.files[0]; if(!file) return;
  const dataUrl = await resizeImageFile(file);
  const previewId = direction==='in' ? 'art-preview' : 'sort-preview';
  document.getElementById(previewId).innerHTML = `<img src="${dataUrl}">`;
  window.__lastArticlePhoto = {dataUrl, direction};
  await analyzeArticlePhoto();
}
async function analyzeArticlePhoto(){
  const ctx = window.__lastArticlePhoto; if(!ctx) return;
  const {dataUrl, direction} = ctx;
  const resultsId = direction==='in' ? 'art-results' : 'sort-results';
  document.getElementById(resultsId).innerHTML = `<p style="color:var(--ink-soft);font-size:13px;"><span class="spinner" style="border-color:rgba(18,101,92,0.3);border-top-color:var(--teal);"></span> Reconnaissance en cours…</p>`;
  try{
    const names = state.products.map(p=>p.name).join(', ') || 'aucun produit enregistré';
    const prompt = `Voici la photo d'un produit de entreprise de logistique et d'impression 3D. Compare-le à cette liste de produits connus : [${names}]. Réponds UNIQUEMENT en JSON, sans texte ni markdown : {"produit_reconnu": "nom exact de la liste ou vide si aucun ne correspond", "confiance": "haute|moyenne|basse"}`;
    const text = await callClaudeWithRetry(prompt, {dataUrl, mediaType:'image/jpeg', kind:'image'});
    const res = extractJSON(text) || {};
    const match = state.products.find(p=>p.name===res.produit_reconnu);
    if(match){
      document.getElementById(resultsId).innerHTML = `
        <div class="panel" style="padding:12px;">
          <p style="margin:0 0 8px 0;font-size:13.5px;">Produit reconnu (confiance ${esc(res.confiance||'?')}) :</p>
          <p style="font-weight:700;margin:0 0 10px 0;">${esc(match.name)}</p>
          <div class="field"><label>Quantité</label><input type="number" id="art-qty-val" value="1" min="1"></div>
          <button class="btn ${direction==='in'?'btn-primary':'btn-rust'}" style="width:100%;justify-content:center;" onclick="confirmArticlePhoto('${match.id}','${direction}')">${direction==='in'?'Ajouter au stock':'Retirer du stock'}</button>
        </div>`;
    } else {
      document.getElementById(resultsId).innerHTML = `<div class="empty">Produit non reconnu automatiquement. Utilisez la saisie manuelle.</div>`;
    }
  }catch(e){
    document.getElementById(resultsId).innerHTML = `<div class="empty">${esc(iaErrorMsg(e))}<br><br>
      <button class="btn btn-primary btn-sm" onclick="analyzeArticlePhoto()">Réessayer</button></div>`;
  }
}
async function confirmArticlePhoto(productId, direction){
  const qtyEl = document.getElementById('art-qty-val');
  const qty = parseInt(qtyEl.value,10)||1;
  state.movements.push({id:uid(), productId, type: direction, qty, date:new Date().toISOString(), user:state.user, note:'Reconnaissance photo', source:'photo'});
  await saveMovements();
  toast(direction==='in'?"Réception ajoutée":"Sortie enregistrée"); renderTabs(); renderContent();
}

async function seAutoSave(){
  const gen = __formGen;
  if(__autoTimer){ clearTimeout(__autoTimer); __autoTimer = null; }
  if(!document.getElementById('se-name')) return;
  const d = seLire();
  const rempli = Object.keys(d).some(k=>d[k]);
  if(!window.__seId && !rempli){ setEtat('se-etat', "Le fournisseur sera créé dès la première saisie."); return; }
  if(window.__seId){
    const s = state.suppliers.find(x=>x.id===window.__seId);
    if(!s) return;
    Object.assign(s, d);
  }else{
    if(!d.name) d.name = "Fournisseur à compléter";
    window.__seId = uid();
    state.suppliers.push({ id: window.__seId, ...d });
    const b = document.getElementById('se-btn-del'); if(b) b.style.display = '';
  }
  await saveSuppliers();
  if(gen === __formGen) setEtat('se-etat', "Enregistré", true);
}

/* Renommer une catégorie répercute le nouveau nom sur tous les produits.
   On conserve donc le nom courant dans __catName au fil des frappes. */
async function catAutoSave(){
  const gen = __formGen;
  if(__autoTimer){ clearTimeout(__autoTimer); __autoTimer = null; }
  const champ = document.getElementById('editcat-input');
  if(!champ || !window.__catName) return;
  const c = state.categories.find(x=>x.name===window.__catName);
  if(!c) return;
  const nouveau = champ.value.trim();
  const couleur = document.getElementById('editcat-color').value;
  if(!nouveau){ setEtat('cat-etat', "Le nom ne peut pas être vide — dernière version conservée."); return; }
  if(nouveau !== c.name && state.categories.some(x=>x.name===nouveau)){
    setEtat('cat-etat', "Une autre catégorie porte déjà ce nom."); return;
  }
  if(nouveau !== c.name){
    state.products.forEach(pr=>{ if(pr.category===c.name) pr.category = nouveau; });
    await saveProducts();
  }
  c.name = nouveau; c.color = couleur;
  window.__catName = nouveau;
  await saveCategories();
  if(gen === __formGen) setEtat('cat-etat', "Enregistré", true);
}

/* ================= SUGGESTIONS FOURNISSEUR / GROSSISTE =================
   Au clic dans le champ : les noms déjà utilisés, les plus fréquents en tête.
   Dès la première lettre : la liste se réduit aux noms correspondants.
   On ne redessine que la petite liste, jamais la fiche entière — sinon le
   champ perdrait le focus à chaque frappe. */
const SUG_CONF = {
  supplier:   { champ:'pe-supplier',   liste:'sug-supplier' },
  wholesaler: { champ:'pe-wholesaler', liste:'sug-wholesaler' }
};
window.__sug = {};

/* Noms connus, classés par nombre de produits qui les utilisent.
   Les doublons de casse sont regroupés (« GACD » et « gacd » = un seul nom),
   et c'est l'orthographe la plus fréquente qui est proposée. */
function sugNoms(type){
  const compte = new Map();
  const ajouter = (nom, poids) => {
    const v = (nom||'').trim();
    if(!v) return;
    const cle = v.toLowerCase();
    const e = compte.get(cle) || { nom:v, n:0, formes:{} };
    e.n += poids;
    e.formes[v] = (e.formes[v]||0) + poids;
    compte.set(cle, e);
  };
  state.products.forEach(p=>ajouter(type==='supplier' ? p.supplier : p.wholesaler, 1));
  // Les fournisseurs de l'onglet dédié sont proposés même s'ils ne servent pas encore.
  if(type==='supplier') state.suppliers.forEach(s=>ajouter(s.name, 0));
  return [...compte.values()]
    .map(e=>{
      const meilleure = Object.keys(e.formes).sort((a,b)=>e.formes[b]-e.formes[a])[0];
      return { nom: meilleure || e.nom, n: e.n };
    })
    .sort((a,b)=> b.n - a.n || a.nom.localeCompare(b.nom,'fr'));
}

function sugAfficher(type){
  const cfg = SUG_CONF[type];
  if(!cfg) return;
  const champ = document.getElementById(cfg.champ);
  const boite = document.getElementById(cfg.liste);
  if(!champ || !boite) return;

  const saisi = champ.value.trim().toLowerCase();
  let liste = sugNoms(type);
  if(saisi){
    // Ce qui commence par la saisie d'abord, puis ce qui la contient.
    const debut  = liste.filter(x=>x.nom.toLowerCase().startsWith(saisi));
    const dedans = liste.filter(x=>!x.nom.toLowerCase().startsWith(saisi) && x.nom.toLowerCase().includes(saisi));
    liste = debut.concat(dedans);
  }
  liste = liste.filter(x=>x.nom.toLowerCase() !== saisi).slice(0, 8);
  window.__sug[type] = liste;

  if(!liste.length){ boite.innerHTML = ''; return; }
  boite.innerHTML = `<div class="ac-list">` + liste.map((x,i)=>`
    <div class="ac-item" onmousedown="event.preventDefault();" onclick="sugChoisir('${type}',${i})">
      ${esc(x.nom)}${x.n ? `<span class="sub"> · ${x.n} produit${x.n>1?'s':''}</span>` : `<span class="sub"> · jamais utilisé</span>`}
    </div>`).join('') + `</div>`;
}

function sugChoisir(type, i){
  const cfg = SUG_CONF[type];
  const choix = (window.__sug[type] || [])[i];
  if(!cfg || !choix) return;
  const champ = document.getElementById(cfg.champ);
  if(champ) champ.value = choix.nom;
  const boite = document.getElementById(cfg.liste);
  if(boite) boite.innerHTML = '';
  peAutoSave();
}

/* Fermeture différée : sans ce délai, la perte de focus efface la liste
   avant que le doigt n'ait fini d'appuyer sur une proposition. */
function sugFermer(type){
  const cfg = SUG_CONF[type];
  if(!cfg) return;
  setTimeout(()=>{
    const boite = document.getElementById(cfg.liste);
    if(boite) boite.innerHTML = '';
  }, 180);
}

/* ================= ENREGISTREMENT AUTOMATIQUE DE LA FICHE =================
   Le produit est créé dès qu'une information est saisie, puis mis à jour à
   chaque frappe. Fermer la page par erreur ne fait donc plus rien perdre.
   Seule la quantité en stock fait exception : elle n'est appliquée qu'en
   sortant du champ, sinon chaque chiffre tapé créerait un mouvement. */
const PE_CHAMPS = ['pe-name','pe-nickname','pe-cat','pe-unit','pe-supplier','pe-ref',
                   'pe-wholesaler','pe-wholesaler-ref','pe-price','pe-threshold','pe-barcode'];
let __peTimer = null;

function peSetEtat(txt, ok){
  const e = document.getElementById('pe-etat');
  if(!e) return;
  e.textContent = txt || '';
  e.style.color = ok ? 'var(--green)' : 'var(--ink-soft)';
}
function peBindAutoSave(){
  PE_CHAMPS.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input',  peAutoSaveDiffere);
    el.addEventListener('change', peAutoSaveDiffere);
  });
  // Les deux champs à suggestions filtrent leur liste à chaque lettre.
  Object.keys(SUG_CONF).forEach(type=>{
    const el = document.getElementById(SUG_CONF[type].champ);
    if(el) el.addEventListener('input', ()=>sugAfficher(type));
  });
  const st = document.getElementById('pe-stock');
  if(st) st.addEventListener('change', ()=>{ peAutoSave(); peAppliquerStock(); });
}
function peAutoSaveDiffere(){
  peSetEtat("Enregistrement…");
  if(__peTimer) clearTimeout(__peTimer);
  __peTimer = setTimeout(peAutoSave, 700);
}
function peLireChamps(){
  const v = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  return {
    name: v('pe-name').trim(),
    nickname: v('pe-nickname').trim(),
    category: v('pe-cat'),
    unit: v('pe-unit').trim() || 'u.',
    supplier: v('pe-supplier').trim(),
    supplierRef: v('pe-ref').trim(),
    wholesaler: v('pe-wholesaler').trim(),
    wholesalerRef: v('pe-wholesaler-ref').trim(),
    price: parseFloat(v('pe-price')) || 0,
    threshold: parseInt(v('pe-threshold'), 10) || 0,
    barcode: v('pe-barcode').trim(),
    photo: window.__editPhoto || null,
  };
}
/* Y a-t-il quelque chose à enregistrer ? On ignore les valeurs par défaut,
   pour ne pas créer de fiche vide si on ouvre puis referme aussitôt. */
function peQuelqueChose(d){
  return !!(d.name || d.nickname || d.supplier || d.supplierRef || d.wholesaler ||
            d.wholesalerRef || d.barcode || d.photo || d.price > 0);
}
async function peAutoSave(){
  const gen = __formGen;
  if(__peTimer){ clearTimeout(__peTimer); __peTimer = null; }
  if(!document.getElementById('pe-name')) return;   // fiche déjà fermée
  const d = peLireChamps();
  if(!window.__peId && !peQuelqueChose(d)){ peSetEtat("Le produit sera créé dès la première saisie."); return; }

  if(window.__peId){
    const prod = state.products.find(x=>x.id===window.__peId);
    if(!prod) return;
    Object.assign(prod, d);
  }else{
    if(!d.name) d.name = "Produit à compléter";
    window.__peId = uid();
    state.products.push({ id: window.__peId, ...d });
    // La fiche existe : on propose désormais de la dupliquer ou de la supprimer.
    const bd = document.getElementById('pe-btn-dup'); if(bd) bd.style.display = '';
    const bs = document.getElementById('pe-btn-del'); if(bs) bs.style.display = '';
  }
  await saveProducts();
  if(gen === __formGen) peSetEtat("Enregistré", true);
}
/* Ajustement de la quantité : uniquement à la sortie du champ. */
async function peAppliquerStock(){
  const el = document.getElementById('pe-stock');
  if(!el || !window.__peId) return;
  const voulu = parseInt(el.value, 10);
  if(isNaN(voulu) || voulu < 0) return;
  const actuel = currentStock(window.__peId);
  const diff = voulu - actuel;
  if(diff === 0) return;
  state.movements.push({ id: uid(), productId: window.__peId,
    type: diff > 0 ? 'in' : 'out', qty: Math.abs(diff), date: new Date().toISOString(),
    user: state.user, note: 'Correction manuelle du stock (fiche produit)', source: 'ajustement' });
  await saveMovements();
  peSetEtat("Enregistré", true);
}
function peFinish(){
  const cree = !!window.__peId || !!document.getElementById('pe-name');
  closeModal();               // le geste de fermeture enregistre
  window.__peId = null;
  if(cree) toast("Produit enregistré");
}
function peDelete(){
  if(!window.__peId) { closeModal(); return; }
  deleteProduct(window.__peId);
}
async function peDuplicate(){
  await peAutoSave();
  await peAppliquerStock();
  if(!window.__peId){ toast("Renseignez d'abord la fiche"); return; }
  const id = window.__peId;
  window.__peId = null;
  duplicateProduct(id);
}
/* Duplication : tout est repris SAUF le code-barres et la quantité en stock,
   qui sont propres à chaque produit. La nouvelle fiche s'ouvre aussitôt. */
async function duplicateProduct(id){
  const src = state.products.find(x=>x.id===id);
  if(!src){ toast("Produit introuvable"); return; }
  const copie = { ...src, id: uid(), barcode: '', name: (src.name||'') + ' (copie)' };
  state.products.push(copie);
  await saveProducts();
  renderTabs(); renderContent();
  openProductEdit(copie.id);
  toast("Copie créée : ajustez ce qui diffère");
  setTimeout(()=>{
    const n = document.getElementById('pe-name');
    if(n){ n.focus(); n.select && n.select(); }
  }, 60);
}
async function handleProductPhoto(ev){
  const file = ev.target.files[0]; if(!file) return;
  const dataUrl = await resizeImageFile(file, 500, 0.6);
  window.__editPhoto = dataUrl;
  document.getElementById('pe-photo-preview').innerHTML = `<img src="${dataUrl}" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-top:8px;">`;
  peAutoSave();
}
async function analyzeProductPhoto(){
  const dataUrl = window.__editPhoto;
  if(!dataUrl){ toast("Ajoutez d'abord une photo"); return; }
  const status = document.getElementById('pe-analyze-status');
  if(status) status.innerHTML = `<span class="spinner" style="border-color:rgba(18,101,92,0.3);border-top-color:var(--teal);"></span> Analyse de la photo…`;
  try{
    const cats = state.categories.map(c=>c.name).join(', ');
    const prompt = `Voici la photo d'un produit de entreprise de logistique et d'impression 3D (emballage, étiquette). Lis attentivement l'étiquette. Extrais les informations pour remplir une fiche produit. Catégories possibles : [${cats}]. S'il y a un code-barres visible, lis ses chiffres.
Réponds UNIQUEMENT en JSON, sans texte ni markdown :
{"nom":"","categorie":"","fournisseur_marque":"","reference":"","code_barres":"","unite":""}
Règles : mets une chaîne vide si une information n'est pas lisible. Pour la catégorie, choisis la plus proche dans la liste fournie, ou laisse vide.`;
    const text = await callClaudeWithRetry(prompt, {dataUrl, mediaType:'image/jpeg', kind:'image'});
    const res = extractJSON(text) || {};
    let filled = [];
    const setVal = (id, val)=>{ const el=document.getElementById(id); if(el && val){ el.value = val; filled.push(1); } };
    setVal('pe-name', res.nom);
    setVal('pe-supplier', res.fournisseur_marque);
    setVal('pe-ref', res.reference);
    setVal('pe-barcode', res.code_barres);
    setVal('pe-unit', res.unite);
    if(res.categorie){
      const sel = document.getElementById('pe-cat');
      if(sel){ const match = state.categories.find(c=>c.name.toLowerCase()===String(res.categorie).toLowerCase()); if(match){ sel.value = match.name; filled.push(1); } }
    }
    if(status) status.innerHTML = filled.length ? `<span style="color:var(--green);">✓ ${filled.length} champ(s) rempli(s) — vérifiez et corrigez si besoin.</span>` : `Aucune information exploitable détectée sur la photo.`;
  }catch(e){
    if(status) status.innerHTML = `<span style="color:var(--rust);">${esc(iaErrorMsg(e))}</span>`;
  }
}
function deleteProduct(id){
  askConfirm("Supprimer définitivement ce produit et son historique ?", async ()=>{
    state.products = state.products.filter(p=>p.id!==id);
    state.movements = state.movements.filter(m=>m.productId!==id);
    await saveProducts(); await saveMovements();
    closeModal(); toast("Produit supprimé"); renderTabs(); renderContent();
  });
}

function viewFinance(){
  const totalValue = state.products.reduce((s,p)=>s+currentStock(p.id)*(p.price||0),0);
  const lowItems = state.products.filter(p=>{const s=currentStock(p.id); return s>0 && s<(p.threshold||0);});
  return `
  <div class="panel">
    <div class="panel-title"><h2>Suivi financier du stock</h2></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${fmtEUR(totalValue)}</div><div class="lbl">Valeur totale du stock</div></div>
      <div class="stat-card" style="background:var(--rust-pale);"><div class="num" style="color:var(--rust);">${lowItems.length}</div><div class="lbl">Produits sous le seuil</div></div>
    </div>
    <h3 style="font-size:14.5px;margin:16px 0 8px 0;">Valeur du stock par catégorie</h3>
    <canvas id="chart-cat" height="180"></canvas>
    <h3 style="font-size:14.5px;margin:20px 0 8px 0;">Entrées / sorties (valeur, par mois)</h3>
    <canvas id="chart-month" height="180"></canvas>
  </div>`;
}
function drawFinanceCharts(){
  const byCat = {};
  state.products.forEach(p=>{ const v=currentStock(p.id)*(p.price||0); byCat[p.category||'Autre']=(byCat[p.category||'Autre']||0)+v; });
  const catLabels = Object.keys(byCat); const catValues = catLabels.map(k=>byCat[k]);
  const ctx1 = document.getElementById('chart-cat');
  if(ctx1) new Chart(ctx1, {type:'bar', data:{labels:catLabels, datasets:[{label:'Valeur (€)', data:catValues, backgroundColor:'#1B3FB0'}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}});

  const byMonth = {};
  state.movements.forEach(m=>{
    const key = m.date.slice(0,7);
    const p = state.products.find(x=>x.id===m.productId);
    const val = (p?p.price:0)*m.qty;
    if(!byMonth[key]) byMonth[key]={in:0,out:0};
    byMonth[key][m.type]+=val;
  });
  const months = Object.keys(byMonth).sort();
  const ctx2 = document.getElementById('chart-month');
  if(ctx2) new Chart(ctx2, {type:'bar', data:{labels:months, datasets:[
    {label:'Entrées', data:months.map(m=>byMonth[m].in), backgroundColor:'#2F7D53'},
    {label:'Sorties', data:months.map(m=>byMonth[m].out), backgroundColor:'#C1502E'}
  ]}, options:{scales:{y:{beginAtZero:true}}}});
}

      </div>

    </div>

  bindAutoSave(['he-product','he-type','he-qty','he-date','he-note'], heAutoSave, 'he-etat');

  setEtat('he-etat', "Les corrections sont enregistrées au fur et à mesure.");
}
async function heAutoSave(){
  const gen = __formGen;
  if(__autoTimer){ clearTimeout(__autoTimer); __autoTimer = null; }
  const id = window.__heId;
  if(!id || !document.getElementById('he-qty')) return;
  const m = state.movements.find(x=>x.id===id);
  if(!m) return;
  const qty = parseInt(document.getElementById('he-qty').value, 10);
  if(isNaN(qty) || qty < 1){ setEtat('he-etat', "Quantité invalide — dernière version conservée."); return; }
  const iso = champVersIso(document.getElementById('he-date').value);
  if(!iso){ setEtat('he-etat', "Date invalide — dernière version conservée."); return; }
  m.productId = document.getElementById('he-product').value;
  m.type = document.getElementById('he-type').value;
  m.qty = qty;
  m.date = iso;
  m.note = document.getElementById('he-note').value.trim();
  await saveMovements();
  if(gen === __formGen) setEtat('he-etat', "Enregistré", true);
}
function heFinish(){ closeModal(); window.__heId = null; toast("Mouvement corrigé"); }
/* Ouvre la fiche du produit concerné par ce mouvement. La correction en
   cours est enregistrée avant de quitter : rien n'est perdu au passage. */
function heVoirProduit(){
  const m = state.movements.find(x=>x.id===window.__heId);
  heAutoSave();                       // mutation synchrone, l'envoi suit
  setCloseHook(null);
  window.__heId = null;
  const produit = m && state.products.find(pr=>pr.id===m.productId);
  if(!produit){ closeModal(); toast("Ce produit n'existe plus"); return; }
  openProductEdit(produit.id);
}
function heDelete(){
  const id = window.__heId;
  setCloseHook(null); window.__heId = null;
  if(id) deleteHistEntry(id); else closeModal();
}

function deleteHistEntry(id){
  askConfirm("Supprimer cette entrée d'historique ?", async ()=>{
    state.movements = state.movements.filter(x=>x.id!==id);
    await saveMovements(); closeModal(); toast("Entrée supprimée"); renderTabs(); renderContent();
  });
}

/* ===================== DONNÉES DES DEUX TABLEAUX =====================
   Un seul endroit décrit le contenu : Excel et PDF s'en servent tous les
   deux, ce qui garantit qu'ils ne divergeront jamais. */
function tableauStock(){
  const entetes = ['Produit','Alias','Catégorie','Stock','Unité','Seuil','À commander','Prix unitaire','Valeur du stock'];
  const lignes = state.products
    .slice()
    .sort((a,b)=>(a.name||'').localeCompare(b.name||'','fr'))
    .map(p=>{
      const s = currentStock(p.id);
      const seuil = p.threshold||0;
      return [ p.name||'', p.nickname||'', p.category||'', s, p.unit||'u.', seuil,
               s < seuil ? 'OUI' : '', +(p.price||0), +((p.price||0)*s).toFixed(2) ];
    });
  return { entetes, lignes };
}
function tableauFiches(){
  const entetes = ['Produit','Alias','Catégorie','Unité','Fournisseur','Réf. fournisseur',
                   'Grossiste','Réf. grossiste','Prix unitaire','Seuil','Code-barres'];
  const lignes = state.products
    .slice()
    .sort((a,b)=>(a.name||'').localeCompare(b.name||'','fr'))
    .map(p=>[ p.name||'', p.nickname||'', p.category||'', p.unit||'u.',
              p.supplier||'', p.supplierRef||'', p.wholesaler||'', p.wholesalerRef||'',
              +(p.price||0), p.threshold||0, p.barcode||'' ]);
  return { entetes, lignes };
}
function nomFichier(ext){
  const cab = (account && account.nom ? account.nom : 'stock').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'');
  return `${cab}-${new Date().toISOString().slice(0,10)}.${ext}`;
}

/* ========================== EXPORT EXCEL ========================== */
function exportExcel(){
  if(!window.XLSX){ toast("Librairie Excel non chargée, réessayez dans un instant"); return; }
  if(!state.products.length){ toast("Aucun produit à exporter"); return; }
  try{
    const stock  = tableauStock();
    const fiches = tableauFiches();
    const classeur = XLSX.utils.book_new();

    const f1 = XLSX.utils.aoa_to_sheet([stock.entetes, ...stock.lignes]);
    f1['!cols'] = [{wch:34},{wch:16},{wch:16},{wch:8},{wch:8},{wch:8},{wch:12},{wch:13},{wch:15}];
    f1['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:stock.lignes.length, c:stock.entetes.length-1}}) };
    f1['!freeze'] = { xSplit:0, ySplit:1 };
    XLSX.utils.book_append_sheet(classeur, f1, 'Stock actuel');

    const f2 = XLSX.utils.aoa_to_sheet([fiches.entetes, ...fiches.lignes]);
    f2['!cols'] = [{wch:34},{wch:16},{wch:16},{wch:8},{wch:20},{wch:16},{wch:20},{wch:16},{wch:13},{wch:8},{wch:18}];
    XLSX.utils.book_append_sheet(classeur, f2, 'Fiches produits');

    XLSX.writeFile(classeur, nomFichier('xlsx'));
    toast("Tableau Excel téléchargé");
  }catch(e){
    console.warn(e);
    toast("Export Excel impossible : " + (e.message||e));
  }
}

/* =========================== EXPORT PDF ===========================
   jsPDF ne sait pas dessiner de tableau : on le fait à la main, avec
   saut de page automatique et en-têtes répétés en haut de chaque page. */
function exportInventairePDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("Librairie PDF non chargée, réessayez dans un instant"); return; }
  if(!state.products.length){ toast("Aucun produit à exporter"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', orientation:'landscape'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marge = 10;
  const cab = (account && account.nom) ? account.nom : 'Gestion de stock';
  const dateStr = new Date().toLocaleDateString('fr-FR');
  let y = marge;

  function titrePage(txt, sousTitre){
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(18,43,39);
    doc.text(txt, marge, y+4);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(82,114,105);
    doc.text(`${cab} · ${dateStr}${sousTitre?' · '+sousTitre:''}`, marge, y+9.5);
    y += 15;
  }
  function enTetes(entetes, largeurs){
    doc.setFillColor(234,243,241);
    doc.rect(marge, y-4, pageW-2*marge, 6.5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(18,101,92);
    let x = marge+1.5;
    entetes.forEach((h,i)=>{ doc.text(String(h).toUpperCase(), x, y); x += largeurs[i]; });
    y += 5;
  }
  function corps(lignes, largeurs, entetes, alerteCol){
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(18,43,39);
    lignes.forEach((ligne, n)=>{
      if(y > pageH - marge - 8){
        doc.addPage(); y = marge; enTetes(entetes, largeurs);
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(18,43,39);
      }
      if(n % 2 === 1){ doc.setFillColor(249,251,250); doc.rect(marge, y-3.4, pageW-2*marge, 5.2, 'F'); }
      const alerte = alerteCol !== undefined && ligne[alerteCol] === 'OUI';
      if(alerte){ doc.setTextColor(193,80,46); doc.setFont('helvetica','bold'); }
      let x = marge+1.5;
      ligne.forEach((c,i)=>{
        const largeurMax = largeurs[i] - 2;
        let txt = (c === null || c === undefined) ? '' : String(c);
        while(txt && doc.getTextWidth(txt) > largeurMax) txt = txt.slice(0, -2);
        doc.text(txt, x, y); x += largeurs[i];
      });
      if(alerte){ doc.setTextColor(18,43,39); doc.setFont('helvetica','normal'); }
      y += 5.2;
    });
  }

  const stock = tableauStock();
  const sous = stock.lignes.filter(l=>l[6]==='OUI').length;
  titrePage('État du stock', `${stock.lignes.length} produits · ${sous} sous le seuil`);
  const l1 = [70,32,30,15,15,14,20,24,25];
  enTetes(stock.entetes, l1);
  corps(stock.lignes, l1, stock.entetes, 6);

  doc.addPage(); y = marge;
  const fiches = tableauFiches();
  titrePage('Fiches produits', `${fiches.lignes.length} produits`);
  const l2 = [50,25,22,12,32,25,32,25,20,13,21];
  enTetes(fiches.entetes, l2);
  corps(fiches.lignes, l2, fiches.entetes);

  const total = doc.internal.getNumberOfPages();
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140,150,150);
    doc.text(`Page ${i} / ${total}`, pageW-marge, pageH-5, {align:'right'});
  }
  doc.save(nomFichier('pdf'));
  toast("PDF téléchargé");
}

function backupPayload(){
  return {
    exported_at: new Date().toISOString(),
    products: state.products,
    movements: state.movements,
    categories: state.categories,
    suppliers: state.suppliers
  };
}
function normalizeCategories(cats){
  if(!cats || !Array.isArray(cats) || cats.length===0) return [...CATS_DEFAULT];
  // Compatibilité : anciennes sauvegardes où les catégories étaient de simples chaînes
  if(typeof cats[0] === 'string'){
    return cats.map((name,i)=>({name, color: CAT_PALETTE[i % CAT_PALETTE.length]}));
  }
  return cats;
}

    return;
  }
  if(!account){
    el.innerHTML = `<div style="color:var(--rust);">Aucun compte connecté.</div>`;
    return;
  }
  el.innerHTML = `<span class="spinner" style="border-color:rgba(18,101,92,0.3);border-top-color:var(--teal);"></span> Test en cours…`;
  try{
    const { data, error } = await withTimeout(
      sb.from(TABLE).select('donnees,maj_le').eq('user_id', account.userId).maybeSingle(), 12000);
    if(error) throw error;
    if(!data){
      el.innerHTML = `<div style="color:var(--amber);">Connexion établie, mais ce compte n'a encore aucune donnée enregistrée. Elle sera créée à la première modification.</div>`;

  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

      doc.setFontSize(9.5); doc.setTextColor(18,43,39);
      doc.text(`${s}/${p.threshold||0}`, pageW-margin-2, y, {align:'right'});

    document.body.appendChild(a); a.click(); a.remove();
    // 2) Fallback visible : bouton pour ouvrir/enregistrer le PDF manuellement

      <p style="color:var(--ink-soft);font-size:13.5px;">Si le téléchargement ne s'est pas lancé tout seul, appuyez ci-dessous pour ouvrir le PDF, puis utilisez le bouton de partage/téléchargement de votre navigateur.</p>

      <a href="${url}" download="${filename}" class="btn btn-outline" style="width:100%;justify-content:center;text-decoration:none;margin-top:8px;">⬇ Enregistrer le PDF</a>
    `);
  }catch(e){
    toast("Erreur PDF : "+(e.message||e));
  }

function escHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function importJSON(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast("Fichier invalide"); return; }
    const nbProd = (data.products||[]).length;
    const nbMouv = (data.movements||[]).length;
    askConfirm(`Restaurer ${nbProd} produit(s) et ${nbMouv} mouvement(s) ? Cela remplacera les données actuelles.`, async ()=>{
      state.products = data.products||[];
      state.movements = data.movements||[];
      state.categories = normalizeCategories(data.categories);
      state.suppliers = data.suppliers||[];
      await saveProducts(); await saveMovements(); await saveCategories(); await saveSuppliers();
      closeModal(); toast(`Restauré : ${nbProd} produits, ${nbMouv} mouvements`); renderTabs(); renderContent();
    });
  };
  reader.readAsText(file);
}

/* ======================= ONGLET : PRODUCTION =======================
   Le principe du calcul.
   Une impression tourne toute seule, y compris la nuit. Ce qui bloque, c'est
   la fin : tant que personne n'a dégagé le plateau, la machine reste occupée.
   Donc une machine n'est pas limitée par ses heures d'ouverture, elle est
   limitée par le nombre de fois où quelqu'un passe la vider.

   L'application simule donc la production impression par impression :
   elle démarre chaque travail dès que la machine est libre, calcule l'heure de
   fin, puis attend le prochain créneau de présence du lieu pour libérer la
   machine. On obtient une date de fin réelle par commande, pas une moyenne.

   Quand une commande ne rentre pas, la même simulation est relancée avec
   différents remèdes pour trouver le plus léger qui suffise. */

const BAMBU_MODELES = ['Bambu A1 mini','Bambu A1','Bambu P1P','Bambu P1S',
                       'Bambu X1C','Bambu X1E','Bambu H2D','Autre'];
/* Gamme Bambu Lab, regroup\u00e9e par famille. Point de d\u00e9part modifiable :
   le catalogue du fabricant \u00e9volue r\u00e9guli\u00e8rement. */
const BAMBU_FILAMENTS = {
  'PLA': ['PLA Basic','PLA Matte','PLA Silk+','PLA Lite','PLA Basic Gradient','PLA Glow',
          'PLA Wood','PLA Marble','PLA Galaxy','PLA Sparkle','PLA Metal','PLA Aero','PLA-CF'],
  'PETG': ['PETG Basic','PETG HF','PETG Translucent','PETG-CF'],
  'ABS et ASA': ['ABS','ABS-GF','ASA','ASA-CF','ASA Aero'],
  'TPU souple': ['TPU 95A HF','TPU 90A','TPU 85A','TPU pour AMS'],
  'Technique': ['PC','PC FR','PA6-CF','PA6-GF','PAHT-CF','PET-CF','PPA-CF','PPS-CF'],
  'Support': ['PVA','Support pour PLA/PETG','Support W','Support G']
};
const BAMBU_COULEURS = ['Noir','Blanc','Gris','Beige','Rouge','Bordeaux','Orange','Jaune',
  'Vert','Vert fonc\u00e9','Bleu','Bleu Klein','Bleu ciel','Violet','Rose','Marron','Or','Argent','Cuivre','Transparent'];

const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
/* Un jour porte une liste de plages de présence, vide si personne n'est là. */
const PLANNING_DEFAUT = {
  0:[], 1:[{de:'09:00', a:'19:00'}], 2:[{de:'09:00', a:'19:00'}],
  3:[{de:'09:00', a:'19:00'}], 4:[{de:'09:00', a:'19:00'}],
  5:[{de:'09:00', a:'19:00'}], 6:[{de:'10:00', a:'18:00'}]
};
/* Ancien format : un objet {actif, de, a} par jour. On le convertit. */
function prodNormalisePlanning(pl){
  const out = {};
  for(let j = 0; j <= 6; j++){
    const v = pl ? pl[j] : null;
    if(Array.isArray(v)) out[j] = v.filter(x=>x && x.de && x.a);
    else if(v && v.actif && v.de && v.a) out[j] = [{de:v.de, a:v.a}];
    else if(v) out[j] = [];
    else out[j] = (PLANNING_DEFAUT[j] || []).map(x=>Object.assign({}, x));
  }
  return out;
}

function prodNum(v, def){ const n = Number(v); return isFinite(n) && n > 0 ? n : def; }
function prodConf(){
  const d = state.prod || {};
  return {
    delaiFournisseur: prodNum(d.delaiFournisseur, 10),
    delaiExpedition:  prodNum(d.delaiExpedition, 6),
    manipulation:     prodNum(d.manipulation, 10),   // minutes pour vider un plateau
    margeBobines:     (d.margeBobines === 0 ? 0 : prodNum(d.margeBobines, 1)),
    montantMini:      prodNum(d.montantMini, 0)
  };
}
/* Ce qui a été réellement imprimé. Une impression validée disparaît du
   planning ; une impression ratée y reste, elle sera replanifiée. */
function prodFaits(orderId, recipeId){
  return (state.runs||[]).filter(r=>r.orderId===orderId && r.recipeId===recipeId && r.statut==='fait')
    .reduce((t,r)=>t + (Number(r.pieces)||0), 0);
}
function prodReste(o, l){
  return Math.max(0, (Number(l.qte)||0) - prodFaits(o.id, l.recipeId));
}
function prodManip(r){
  const v = Number(r && r.manipMinutes);
  return v > 0 ? v : prodConf().manipulation;
}
function prodRecette(id){ return (state.recipes||[]).find(r=>r.id===id) || null; }

/* Durée saisie dans une seule case, au pavé numérique.
   On tape les chiffres à la suite : 430 donne 4 h 30, 45 donne 45 min. */
function prodDureeSaisie(el){
  const d = String(el.value||'').replace(/\D/g,'').slice(-4);
  el.dataset.raw = d;
  if(!d){ el.value = ''; return; }
  if(d.length <= 2){ el.value = d + ' min'; return; }
  el.value = parseInt(d.slice(0,-2),10) + ' h ' + d.slice(-2);
}
function prodDureeLue(id){
  const el = document.getElementById(id);
  const d = el ? String(el.dataset.raw||'') : '';
  if(!d) return 0;
  if(d.length <= 2) return parseInt(d,10) || 0;
  return (parseInt(d.slice(0,-2),10)||0) * 60 + (parseInt(d.slice(-2),10)||0);
}
function prodDureeInit(min){
  const m = Math.max(0, Math.round(Number(min)||0));
  if(!m) return {raw:'', txt:''};
  const h = Math.floor(m/60), r = m%60;
  if(!h) return {raw:String(r), txt:r + ' min'};
  return {raw:String(h) + String(r).padStart(2,'0'), txt:h + ' h ' + String(r).padStart(2,'0')};
}
function prodImprimante(id){ return (state.printers||[]).find(p=>p.id===id) || null; }
function prodMachines(){ return (state.printers||[]).filter(p=>p.actif !== false); }
function prodLieu(id){ return (state.sites||[]).find(s=>s.id===id) || (state.sites||[])[0] || null; }

/* Crée le lieu par défaut et y rattache les imprimantes orphelines. */
function prodMigration(){
  state.sites = state.sites || [];
  if(!state.sites.length){
    state.sites.push({id:uid(), nom:"Atelier", planning:JSON.parse(JSON.stringify(PLANNING_DEFAUT)), exceptions:[]});
  }
  state.sites.forEach(s=>{ s.planning = prodNormalisePlanning(s.planning); });
  const def = state.sites[0].id;
  (state.printers||[]).forEach(p=>{ if(!p.siteId || !prodLieu(p.siteId)) p.siteId = def; });
}

/* ---------------- Présence : le calendrier d'un lieu ---------------- */
function prodIso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function prodAt(iso, hhmm){
  const [a,m,j] = iso.split('-').map(Number);
  const [H,M] = String(hhmm||'00:00').split(':').map(Number);
  return new Date(a, m-1, j, H||0, M||0, 0, 0);
}
function prodPlusJours(iso, n){
  const d = prodAt(iso, '12:00'); d.setDate(d.getDate() + n); return prodIso(d);
}
/* Toutes les plages de présence d'un lieu à une date, triées. */
function prodCreneaux(site, iso){
  if(!site) return [];
  const exs = (site.exceptions||[]).filter(e=> iso >= e.du && iso <= (e.au || e.du));
  let l;
  if(exs.length){
    l = exs.filter(e=>e.ouvert && e.de && e.a).map(e=>({de:e.de, a:e.a}));
  }else{
    const pl = prodNormalisePlanning(site.planning);
    l = (pl[new Date(prodAt(iso,'12:00')).getDay()] || []).slice();
  }
  return l.filter(x=>x.de && x.a && x.a > x.de).sort((x,y)=>x.de.localeCompare(y.de));
}
function prodCreneau(site, iso){ const l = prodCreneaux(site, iso); return l.length ? l[0] : null; }
/* Premier instant de présence à partir de ts. null si rien dans l'année. */
/* Cette fonction est appel\u00e9e des milliers de fois par simulation et balaie
   les jours un par un. On m\u00e9morise ses r\u00e9sultats : sans cela, l'application
   se fige quelques secondes \u00e0 chaque rendu d\u00e8s que les commandes s'accumulent. */
let __memoPresence = {};
function prodProchainePresence(site, ts){
  const cle = (site ? site.id : '-') + '|' + (+ts);
  const vu = __memoPresence[cle];
  if(vu !== undefined) return vu ? new Date(vu) : null;
  const r = prodPresenceCalcul(site, ts);
  __memoPresence[cle] = r ? +r : null;
  return r;
}
function prodPresenceCalcul(site, ts){
  let d = new Date(ts);
  for(let i = 0; i < 400; i++){
    const iso = prodIso(d);
    const crs = prodCreneaux(site, iso);
    for(const cr of crs){
      const debut = prodAt(iso, cr.de), fin = prodAt(iso, cr.a);
      if(d < debut) return debut;
      if(d < fin) return new Date(d);
    }
    d = prodAt(prodIso(new Date(d.getTime() + 86400000)), '00:00');
  }
  return null;
}

/* Trois \u00e9tats : en production, produite mais pas partie, livr\u00e9e. */
function prodEtatCommande(o){
  if(o.livree) return {cle:'livree',    coul:'var(--green)', txt:'Livr\u00e9e'};
  if(o.fait)   return {cle:'produite',  coul:'var(--amber)', txt:'Produite, pas encore livr\u00e9e'};
  return              {cle:'production', coul:'var(--rust)',  txt:'En production'};
}
function prodPastille(o){
  const e = prodEtatCommande(o);
  return `<span class="cmd-etat" style="background:${e.coul};" title="${e.txt}"></span>`;
}

/* Livraison : les pi\u00e8ces quittent l'atelier, donc le stock. */
async function prodLivre(orderId){
  const o = (state.orders||[]).find(x=>x.id===orderId);
  if(!o || o.livree) return;
  let sorties = 0;
  (o.lignes||[]).forEach(l=>{
    const r = prodRecette(l.recipeId);
    if(!r || !r.produitFiniId) return;
    if(!state.products.some(pp=>pp.id === r.produitFiniId)) return;
    const q = Number(l.qte) || 0;
    if(q <= 0) return;
    state.movements.push({id:uid(), productId:r.produitFiniId, type:'out', qty:q,
      date:new Date().toISOString(), user:state.user || null, source:'livraison',
      note:'Livraison ' + (o.client || 'commande')});
    sorties += q;
  });
  o.livree = true; o.livreeLe = new Date().toISOString();
  if(!o.fait) o.fait = true;
  scheduleCloudSave(); setCloseHook(null); closeModal();
  toast(sorties ? `Livr\u00e9e \u00b7 ${sorties} pi\u00e8ce${sorties>1?'s':''} sortie${sorties>1?'s':''} du stock` : 'Commande livr\u00e9e');
  renderContent();
}
function prodAnnuleLivraison(orderId){
  const o = (state.orders||[]).find(x=>x.id===orderId);
  if(!o || !o.livree) return;
  askConfirm('Annuler la livraison ? Les pi\u00e8ces reviennent en stock.', async ()=>{
    (o.lignes||[]).forEach(l=>{
      const r = prodRecette(l.recipeId);
      if(!r || !r.produitFiniId) return;
      const q = Number(l.qte) || 0;
      if(q <= 0) return;
      state.movements.push({id:uid(), productId:r.produitFiniId, type:'in', qty:q,
        date:new Date().toISOString(), user:state.user || null, source:'livraison',
        note:'Livraison annul\u00e9e'});
    });
    o.livree = false; o.livreeLe = null;
    scheduleCloudSave(); closeModal(); toast('Livraison annul\u00e9e'); renderContent();
  });
}

/* Prix d'une commande. Les prix saisis sont soit HT, soit TTC selon le
   contrat : on convertit dans les deux sens \u00e0 partir du taux de TVA. */
function prodTotal(o){
  const tva = (o && isFinite(Number(o.tva))) ? Number(o.tva) : 20;
  const somme = (o.lignes||[]).reduce((t,l)=>
    t + (Number(l.qte)||0) * (Number(l.prix)||0), 0);
  const ttc = o.prixTTC ? somme : somme * (1 + tva/100);
  const ht  = o.prixTTC ? somme / (1 + tva/100) : somme;
  return {ht, ttc, tva, saisi: somme, base: o.prixTTC ? 'TTC' : 'HT'};
}

function prodCommandesEnCours(){
  return (state.orders||[]).filter(o=>!o.fait)
    .sort((a,b)=> String(a.dateLivraison||'').localeCompare(String(b.dateLivraison||'')));
}

/* ---------------- La simulation ----------------
   Deux contraintes se combinent : les machines et la matière.

   Une machine ne peut imprimer que si la bobine de la pièce est réellement
   disponible à cet instant. Quand la bobine de la pièce la plus urgente
   manque, l'application cherche une autre pièce à glisser — mais seulement
   si elle libère la machine avant l'arrivée de la bobine attendue. Occuper
   une machine ne doit jamais retarder une livraison.

   Le calcul se fait donc en trois temps : une première passe sans contrainte
   de matière pour connaître la consommation, un plan de réapprovisionnement
   échelonné qui en découle, puis une seconde passe qui tient compte des
   dates d'arrivée réelles. */

function prodTravaux(){
  const c = prodConf();
  const travaux = [];
  prodCommandesEnCours().forEach((o, rang)=>{
    const limite = o.dateLivraison ? prodPlusJours(o.dateLivraison, -c.delaiExpedition) : todayISO();
    (o.lignes||[]).forEach(l=>{
      const r = prodRecette(l.recipeId);
      if(!r) return;
      const parImp = Math.max(1, Number(r.piecesParImpression) || 1);
      const reste = prodReste(o, l);
      if(reste <= 0) return;
      const nb = Math.ceil(reste / parImp);
      for(let k = 0; k < nb; k++){
        const pieces = Math.min(parImp, reste - k * parImp);
        travaux.push({
          orderId: o.id, client: o.client, recipeId: r.id, article: r.nom,
          filamentId: r.filamentId || null,
          conso: r.filamentId ? pieces / Math.max(1, Number(r.piecesParBobine) || 1) : 0,
          duree: Math.max(1, Number(r.minutesPiece) || 1),
          manip: prodManip(r),
          compat: (r.printerIds || []).slice(),
          pieces, limite, rang, ordre: travaux.length
        });
      }
    });
  });
  return travaux;
}

/* Stock de bobines disponible à un instant donné, arrivées comprises. */
/* Délai de livraison propre à une bobine. À défaut, le réglage général :
   un filament français et un import n'ont pas le même délai. */
function prodDelaiFil(filId){
  const p = (state.products||[]).find(x=>x.id === filId);
  const v = p ? Number(p.delaiJours) : NaN;
  return (isFinite(v) && v >= 0) ? v : prodConf().delaiFournisseur;
}

function prodDispo(filId, t, stock, arrivees){
  let q = stock[filId] || 0;
  (arrivees[filId] || []).forEach(a=>{ if(a.date <= t) q += a.qte; });
  return q;
}
function prodProchaineArrivee(filId, t, arrivees){
  let meilleure = null;
  (arrivees[filId] || []).forEach(a=>{
    if(a.date > t && (!meilleure || a.date < meilleure)) meilleure = a.date;
  });
  return meilleure;
}

/* machines : les machines à utiliser (les clones portent clonDe).
   options : {matiere:false pour ignorer les bobines, arrivees:{filId:[{date,qte}]}} */
function prodSimule(machines, sites, options){
  const c = prodConf();
  const opt = options || {};
  const tenirCompteMatiere = opt.matiere !== false;
  const arrivees = opt.arrivees || {};
  const lieuDe = m => (sites||[]).find(s=>s.id===m.siteId) || (sites||[])[0] || null;
  const maintenant = new Date();

  __memoPresence = {};   // les lieux modifi\u00e9s gardent leur identifiant : on repart de z\u00e9ro
  const stock = {};
  (state.products||[]).forEach(p=>{ stock[p.id] = currentStock(p.id); });

  const libre = {};
  machines.forEach(m=>{ libre[m.id] = new Date(maintenant); });

  const restants = prodTravaux();
  // Tri\u00e9 une fois pour toutes : la boucle n'a plus qu'\u00e0 le parcourir.
  restants.sort((a,b)=> String(a.limite).localeCompare(String(b.limite)) || a.ordre - b.ordre);
  const jobs = [];
  const conso = {};            // filamentId -> [{date, qte}] pour le plan d'appro
  const attentes = {};         // filamentId -> minutes de machine perdues
  let impossible = false, sansMachineGlobal = false;

  let garde = 0;
  while(restants.length && garde++ < 20000){
    // La machine libre le plus tôt choisit son prochain travail.
    // Quelles machines ont encore quelque chose \u00e0 faire : un seul parcours.
    const occupables = {};
    for(const j of restants) for(const id of j.compat) occupables[id] = true;
    let mach = null;
    for(const m of machines){
      if(!occupables[m.clonDe || m.id]) continue;
      if(!mach || libre[m.id] < libre[mach.id]) mach = m;
    }
    if(!mach){ sansMachineGlobal = true; break; }

    const T = new Date(libre[mach.id]);
    const cleMach = mach.clonDe || mach.id;
    const possibles = [];
    for(const j of restants) if(j.compat.includes(cleMach)) possibles.push(j);
    if(!possibles.length){ sansMachineGlobal = true; break; }

    let choisi = null, attenteJusqu = null;
    if(!tenirCompteMatiere){
      choisi = possibles[0];
    }else{
      const bloques = [];
      for(const j of possibles){
        if(!j.filamentId || prodDispo(j.filamentId, T, stock, arrivees) >= j.conso - 1e-9){
          if(!bloques.length){ choisi = j; break; }     // rien de plus urgent n'attend
          // On glisse ce travail seulement s'il rend la machine avant l'arrivée attendue.
          const finImp = new Date(T.getTime() + j.duree * 60000);
          const vid = prodProchainePresence(lieuDe(mach), finImp);
          const rendu = vid ? new Date(vid.getTime() + j.manip * 60000) : null;
          if(rendu && bloques[0].arrivee && rendu <= bloques[0].arrivee){ choisi = j; break; }
          continue;                                     // sinon on laisse la machine libre
        }
        const arr = prodProchaineArrivee(j.filamentId, T, arrivees);
        bloques.push({job:j, arrivee: arr ? new Date(arr) : null});
      }
      if(!choisi){
        const avecDate = bloques.filter(b=>b.arrivee);
        if(!avecDate.length){ impossible = true; break; }
        attenteJusqu = avecDate.reduce((min,b)=> !min || b.arrivee < min ? b.arrivee : min, null);
      }
    }

    if(!choisi){
      const perdu = (attenteJusqu - T) / 60000;
      const f = possibles.find(j=>j.filamentId);
      if(f) attentes[f.filamentId] = (attentes[f.filamentId] || 0) + Math.max(0, perdu);
      libre[mach.id] = new Date(attenteJusqu);
      continue;
    }

    const depart = new Date(T);
    const finImp = new Date(depart.getTime() + choisi.duree * 60000);
    const vidage = prodProchainePresence(lieuDe(mach), finImp);
    if(!vidage){ impossible = true; break; }
    const libere = new Date(vidage.getTime() + choisi.manip * 60000);
    libre[mach.id] = libere;

    if(choisi.filamentId){
      stock[choisi.filamentId] = (stock[choisi.filamentId] || 0) - choisi.conso;
      (conso[choisi.filamentId] = conso[choisi.filamentId] || []).push({date: depart, qte: choisi.conso});
    }

    jobs.push(Object.assign({}, choisi, {
      printerId: mach.id, machine: mach.nom, virtuelle: !!mach.clonDe,
      depart, finImp, vidage, libere
    }));
    restants.splice(restants.indexOf(choisi), 1);
  }

  // Regroupement par commande.
  const resultats = prodCommandesEnCours().map(o=>{
    const siens = jobs.filter(j=>j.orderId === o.id);
    const limite = o.dateLivraison ? prodPlusJours(o.dateLivraison, -c.delaiExpedition) : prodIso(maintenant);
    const resteTotal = (o.lignes||[]).reduce((t,l)=>t + prodReste(o,l), 0);
    const minutes = siens.reduce((t,j)=>t + j.duree, 0);
    const sansMachine = (o.lignes||[]).some(l=>{
      const r = prodRecette(l.recipeId);
      if(!r || prodReste(o,l) <= 0) return false;
      return !(r.printerIds||[]).some(id=>{ const p = prodImprimante(id); return p && p.actif !== false; });
    });
    let fin = null, debut = null;
    siens.forEach(j=>{
      if(!fin || j.libere > fin) fin = j.libere;
      if(!debut || j.depart < debut) debut = j.depart;
    });
    const finIso = fin ? prodIso(fin) : null;
    return {
      o, minutes, sansMachine, resteTotal, termine: resteTotal === 0,
      debut: debut ? prodIso(debut) : prodIso(maintenant),
      fin: finIso, limite,
      retard: !!(finIso && finIso > limite),
      jourRetard: finIso ? Math.round((prodAt(finIso,'12:00') - prodAt(limite,'12:00')) / 86400000) : 0
    };
  });

  jobs.sort((a,b)=> a.depart - b.depart);
  return {commandes: resultats, jobs, conso, attentes, impossible,
          sansMachineGlobal,
          enRetard: resultats.filter(r=>r.retard || r.sansMachine)};
}

/* ---------------- Réapprovisionnement échelonné ----------------
   Plutôt qu'une grosse commande immédiate, on découpe en livraisons
   successives, chacune passée au plus tard. Chaque commande doit atteindre
   le montant minimum du fournisseur : si elle ne l'atteint pas, on avance
   les bobines de la commande suivante jusqu'à y arriver. */
function prodPlanAppro(consoParFil){
  const c = prodConf();
  const aujourdhui = todayISO();
  const lots = [];          // {dateCommande, dateArrivee, lignes:{filId:qte}, montant}

  Object.keys(consoParFil).forEach(filId=>{
    const prod = (state.products||[]).find(p=>p.id === filId);
    const delai = prodDelaiFil(filId);
    const evts = consoParFil[filId].slice().sort((a,b)=>a.date - b.date);
    let dispo = (prod ? currentStock(prod.id) : 0) - c.margeBobines;
    let i = 0;
    while(i < evts.length){
      // On consomme jusqu'à tomber sous zéro.
      while(i < evts.length && dispo - evts[i].qte >= -1e-9){ dispo -= evts[i].qte; i++; }
      if(i >= evts.length) break;
      const dateBesoin = prodIso(evts[i].date);
      let dateCommande = prodPlusJours(dateBesoin, -delai);
      if(dateCommande < aujourdhui) dateCommande = aujourdhui;
      // Quantité : de quoi tenir jusqu'à la commande suivante, une semaine plus tard.
      const horizon = prodAt(prodPlusJours(dateBesoin, 7 + delai), '23:59');
      let besoin = 0;
      for(let k = i; k < evts.length && evts[k].date <= horizon; k++) besoin += evts[k].qte;
      const qte = Math.max(1, Math.ceil(besoin - dispo));
      lots.push({filId, dateCommande, delai, arrivee: prodPlusJours(dateCommande, delai),
                 qte, prix: (prod && Number(prod.price)) || 0,
                 nom: prod ? prod.name : 'Bobine supprimée'});
      dispo += qte;
    }
  });

  // Regroupement par date de commande.
  const parDate = {};
  lots.forEach(l=>{ (parDate[l.dateCommande] = parDate[l.dateCommande] || []).push(l); });
  const dates = Object.keys(parDate).sort();
  const commandes = dates.map(d=>{
    const lignes = parDate[d];
    // Chaque ligne garde son délai : la commande est complète quand la plus lente arrive.
    return {date: d, lignes,
            arrivee: lignes.reduce((max,l)=> l.arrivee > max ? l.arrivee : max, lignes[0].arrivee),
            montant: lignes.reduce((t,l)=>t + l.qte * l.prix, 0)};
  });

  // Deux commandes rapprochées sous le minimum : on les fusionne sur la
  // date la plus tôt, plutôt que de payer deux fois le port.
  const mini = c.montantMini;
  if(mini > 0){
    for(let k = 0; k < commandes.length - 1; k++){
      const a = commandes[k], b = commandes[k+1];
      if(a.montant >= mini - 1e-9) continue;
      const ecart = (prodAt(b.date,'12:00') - prodAt(a.date,'12:00')) / 86400000;
      if(ecart > 10) continue;
      b.lignes.forEach(l=>{
        l.arrivee = prodPlusJours(a.date, l.delai);
        const deja = a.lignes.find(x=>x.filId === l.filId);
        if(deja) deja.qte += l.qte; else a.lignes.push(l);
      });
      a.montant = a.lignes.reduce((t,l)=>t + l.qte * l.prix, 0);
      a.arrivee = a.lignes.reduce((max,l)=> l.arrivee > max ? l.arrivee : max, a.lignes[0].arrivee);
      commandes.splice(k+1, 1);
      k--;
    }
  }

  // Montant minimum : on avance des bobines de la commande suivante.
  if(mini > 0){
    for(let k = 0; k < commandes.length; k++){
      const cm = commandes[k];
      let suiv = k + 1;
      while(cm.montant < mini - 1e-9 && suiv < commandes.length){
        const don = commandes[suiv];
        while(don.lignes.length && cm.montant < mini - 1e-9){
          const l = don.lignes[0];
          const manque = mini - cm.montant;
          const combien = l.prix > 0 ? Math.min(l.qte, Math.ceil(manque / l.prix)) : l.qte;
          const dejaLa = cm.lignes.find(x=>x.filId === l.filId);
          if(dejaLa) dejaLa.qte += combien;
          else cm.lignes.push(Object.assign({}, l, {qte: combien, arrivee: prodPlusJours(cm.date, l.delai)}));
          cm.montant += combien * l.prix;
          l.qte -= combien;
          if(l.qte <= 0) don.lignes.shift();
        }
        don.montant = don.lignes.reduce((t,l)=>t + l.qte * l.prix, 0);
        if(!don.lignes.length){ commandes.splice(suiv, 1); } else suiv++;
      }
    }
  }

  const arrivees = {};
  commandes.forEach(cm=>cm.lignes.forEach(l=>{
    (arrivees[l.filId] = arrivees[l.filId] || []).push({date: prodAt(l.arrivee || cm.arrivee, '09:00'), qte: l.qte});
  }));
  return {commandes, arrivees};
}

/* ---------------- Bobines : l'état de chaque référence ---------------- */
function prodBobines(sim, appro){
  const c = prodConf();
  const aujourdhui = todayISO();
  const out = [];
  const vus = {};
  sim.commandes.forEach(x=>{
    (x.o.lignes||[]).forEach(l=>{
      const r = prodRecette(l.recipeId);
      if(!r || !r.filamentId || vus[r.filamentId]) return;
      vus[r.filamentId] = true;
      const prod = (state.products||[]).find(p=>p.id === r.filamentId);
      const besoin = (sim.conso[r.filamentId] || []).reduce((t,e)=>t + e.qte, 0);
      const cmds = (appro.commandes || []).filter(cm=>cm.lignes.some(li=>li.filId === r.filamentId));
      const aCommander = cmds.reduce((t,cm)=>
        t + cm.lignes.filter(li=>li.filId === r.filamentId).reduce((s,li)=>s + li.qte, 0), 0);
      const premiere = cmds.length ? cmds[0] : null;
      out.push({
        id: r.filamentId,
        nom: prod ? prod.name : 'Bobine supprimée',
        stock: prod ? currentStock(prod.id) : 0,
        besoin, manque: aCommander,
        dateCommande: premiere ? premiere.date : null,
        urgent: !!(premiere && premiere.date <= aujourdhui),
        echelonnee: cmds.length > 1,
        nbCommandes: cmds.length,
        attente: Math.round((sim.attentes[r.filamentId] || 0) / 60)
      });
    });
  });
  return out.filter(f=>f.besoin > 0)
    .sort((a,b)=> (b.manque>0)-(a.manque>0) ||
                  String(a.dateCommande||'z').localeCompare(String(b.dateCommande||'z')));
}

/* ---------------- Les remèdes ----------------
   On relance la simulation avec un levier à la fois, du moins coûteux au plus
   coûteux, et on garde le premier qui fait rentrer toutes les commandes. */
function prodElargit(sites, minutes){
  const copie = JSON.parse(JSON.stringify(sites));
  copie.forEach(s=>{
    Object.keys(s.planning || {}).forEach(j=>{
      const p = s.planning[j];
      if(p && p.actif && p.a){
        const [H,M] = p.a.split(':').map(Number);
        const t = Math.min(23*60+59, H*60 + M + minutes);
        p.a = String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
      }
    });
  });
  return copie;
}
function prodOuvreToutJour(sites){
  const copie = JSON.parse(JSON.stringify(sites));
  copie.forEach(s=>{
    for(let j = 0; j <= 6; j++){
      s.planning = s.planning || {};
      if(!s.planning[j] || !s.planning[j].actif) s.planning[j] = {actif:true, de:'10:00', a:'18:00'};
    }
  });
  return copie;
}
function prodClones(n){
  // On duplique la machine la plus sollicitée parmi celles des commandes en retard.
  const charge = {};
  prodCommandesEnCours().forEach(o=>(o.lignes||[]).forEach(l=>{
    const r = prodRecette(l.recipeId); if(!r) return;
    (r.printerIds||[]).forEach(id=>{ charge[id] = (charge[id]||0) + (Number(l.qte)||0) * (Number(r.minutesPiece)||0); });
  }));
  let ref = null, max = -1;
  prodMachines().forEach(m=>{ if((charge[m.id]||0) > max){ max = charge[m.id]||0; ref = m; } });
  if(!ref) return [];
  const out = [];
  for(let i = 1; i <= n; i++)
    out.push({id:'clone-'+i, nom:`${ref.modele} supplémentaire ${i}`, modele:ref.modele,
              siteId:ref.siteId, actif:true, clonDe:ref.id});
  return out;
}
function prodRemedes(){
  const sites = state.sites || [];
  const plan = prodPlanning();
  if(plan.remedes) return plan.remedes;        // d\u00e9j\u00e0 cherch\u00e9s pour cet \u00e9tat
  const arr = (plan.appro || {}).arrivees || {};
  const jouer = (m, s) => prodSimule(m, s, {arrivees: arr});
  const base = plan.sim;                       // d\u00e9j\u00e0 calcul\u00e9, on ne refait rien
  if(!base.enRetard.length) return (plan.remedes = {base, ok:true, pistes:[]});

  const pistes = [];
  const essais = [
    {t:'plages', texte:"Rester 2 h de plus chaque jour d'ouverture", sim:()=>jouer(prodMachines(), prodElargit(sites, 120))},
    {t:'plages', texte:"Rester 4 h de plus chaque jour d'ouverture", sim:()=>jouer(prodMachines(), prodElargit(sites, 240))},
    {t:'jours',  texte:"Ouvrir aussi les jours de fermeture, 10 h – 18 h", sim:()=>jouer(prodMachines(), prodOuvreToutJour(sites))}
  ];
  for(const e of essais){
    const s = e.sim();
    if(!s.enRetard.length){ pistes.push({texte:e.texte, suffit:true}); break; }
  }
  for(let n = 1; n <= 4; n++){
    const cl = prodClones(n);
    if(!cl.length) break;
    const s = jouer(prodMachines().concat(cl), sites);
    if(!s.enRetard.length){
      pistes.push({texte:`Ajouter ${n} ${cl[0].modele}${n>1?' de plus':''}`, suffit:true});
      break;
    }
  }
  // Combinaison : machines en plus ET plages élargies.
  if(!pistes.length){
    for(let n = 1; n <= 6; n++){
      const cl = prodClones(n);
      if(!cl.length) break;
      const s = jouer(prodMachines().concat(cl), prodElargit(sites, 180));
      if(!s.enRetard.length){
        pistes.push({texte:`Ajouter ${n} ${cl[0].modele} et rester 3 h de plus chaque jour`, suffit:true});
        break;
      }
    }
  }
  // Repli : la date réaliste sans rien changer.
  const c = prodConf();
  base.enRetard.forEach(x=>{
    if(x.fin) pistes.push({texte:`${x.o.client||'Commande'} : livrable le ${fmtDate(prodPlusJours(x.fin, c.delaiExpedition))} si rien ne change`, suffit:false});
  });
  return (plan.remedes = {base, ok:false, pistes});
}

/* Résultat mis en cache : la simulation tourne à chaque rendu d'onglet. */
function prodPlanning(){
  prodMigration();
  const cle = JSON.stringify([state.orders, state.recipes, state.printers, state.sites,
                              state.prod, (state.runs||[]).length, state.movements.length, state.artCats]);
  if(window.__prodCache && window.__prodCache.cle === cle) return window.__prodCache.val;
  const machines = prodMachines();
  const sites = state.sites || [];
  // 1. Sans contrainte de matière : on apprend ce qui sera consommé et quand.
  const libre = prodSimule(machines, sites, {matiere:false});
  // 2. Le plan de commandes en découle, échelonné et au plus tard.
  const appro = prodPlanAppro(libre.conso);
  // 3. On rejoue en tenant compte des dates d'arrivée réelles.
  const sim = prodSimule(machines, sites, {arrivees: appro.arrivees});
  const val = {sim, libre, appro, alertes: prodBobines(sim, appro),
               conf: prodConf(), machines: machines.length};
  window.__prodCache = {cle, val};
  return val;
}

/* Ce qu'affiche la tuile Production sur l'accueil. */
function prodTuileNombre(){
  try{ return prodPlanning().sim.commandes.length; }catch(e){ return 0; }
}
function prodTuileTexte(){
  try{
    const p = prodPlanning();
    const manque = p.alertes.filter(f=>f.manque > 0).length;
    const retard = p.sim.enRetard.length;
    if(!p.sim.commandes.length) return 'aucune commande en cours';
    const s = p.sim.commandes.length > 1 ? 's' : '';
    if(manque) return `commande${s} \u00b7 ${manque} bobine${manque>1?'s':''} \u00e0 commander`;
    if(retard) return `commande${s} \u00b7 ${retard} hors d\u00e9lai`;
    return `commande${s} \u00b7 d\u00e9lais tenus`;
  }catch(e){ return 'production'; }
}
function prodTuileAlerte(){
  try{
    const p = prodPlanning();
    return p.alertes.some(f=>f.manque > 0) || p.sim.enRetard.length > 0;
  }catch(e){ return false; }
}

function viewProdPlanning(){
  const p = prodPlanning();
  if(!(state.orders||[]).length)
    return `<div class="empty">Aucune commande enregistrée. Ajoutez-en une : le planning se calcule tout seul.</div>`;
  if(!p.sim.commandes.length)
    return `<div class="empty">Toutes les commandes sont fabriquées. Rien à anticiper.</div>`;

  const avert = !p.machines
    ? `<div class="prod-row" style="border-left:3px solid var(--rust);"><div class="prod-row-nom">Aucune imprimante en service</div><div class="prod-row-sub">Rien ne peut être planifié. Ajoutez vos machines dans l'onglet Imprimantes.</div></div>`
    : '';

  const rem = p.machines ? prodRemedes() : null;
  const solution = (rem && !rem.ok && rem.pistes.length) ? `
    <h3 class="prod-h">Pour tenir les délais</h3>
    ${rem.pistes.map(x=>`<div class="prod-row" style="border-left:3px solid ${x.suffit?'var(--teal)':'var(--ink-soft)'};">
      <div class="prod-row-nom" style="font-weight:${x.suffit?600:500};">${esc(x.texte)}</div>
      ${x.suffit?`<div class="prod-row-sub">Suffit à faire rentrer toutes les commandes.</div>`:''}
    </div>`).join('')}` : '';

  const bobines = p.alertes.length ? p.alertes.map(f=>{
    const ok = f.manque <= 0;
    const coul = ok ? 'var(--green)' : (f.urgent ? 'var(--rust)' : 'var(--amber)');
    return `<div class="prod-row" style="border-left:3px solid ${coul};">
      <div class="prod-row-nom">${esc(f.nom)}</div>
      <div class="prod-row-sub">${ok
        ? `Stock suffisant : ${f.stock} en réserve pour ${f.besoin.toFixed(1)} nécessaires`
        : `${f.stock} en stock, ${f.besoin.toFixed(1)} nécessaires — ${f.manque} bobine${f.manque>1?'s':''} à commander${
            f.echelonnee ? `, en ${f.nbCommandes} livraisons` : ''}`}</div>
      ${ok?'':`<div class="prod-row-sub" style="color:${coul};font-weight:600;">${
        f.dateCommande ? (f.urgent ? `Première commande à passer maintenant`
                                   : `Première commande à passer le ${fmtDate(f.dateCommande)}`)
                       : 'Date de besoin inconnue'}</div>`}
      ${f.attente > 0 ? `<div class="prod-row-sub" style="color:var(--rust);">${f.attente} h de machine perdues à attendre cette bobine</div>` : ''}
    </div>`;
  }).join('') : `<div class="empty">Aucun article de ces commandes n'a de bobine renseignée.</div>`;

  const lots = (p.appro && p.appro.commandes) || [];
  const appro = lots.length ? `
    <h3 class="prod-h">Commandes fournisseur à passer</h3>
    ${lots.map(cm=>{
      const passe = cm.date <= todayISO();
      const sousMini = p.conf.montantMini > 0 && cm.montant < p.conf.montantMini;
      return `<div class="prod-row" style="border-left:3px solid ${passe?'var(--rust)':'var(--teal)'};">
        <div class="prod-row-nom">${passe ? 'À passer maintenant' : `À passer le ${fmtDate(cm.date)}`}${
          cm.montant ? ` · ${fmtEUR(cm.montant)}` : ''}</div>
        <div class="prod-row-sub">Livraison attendue le ${fmtDate(cm.arrivee)}</div>
        ${cm.lignes.map(l=>{
          const varie = cm.lignes.some(x=>x.delai !== cm.lignes[0].delai);
          return `<div class="prod-row-sub">${l.qte} × ${esc(l.nom)}${varie ? ` — arrive le ${fmtDate(l.arrivee)}` : ''}</div>`;
        }).join('')}
        ${sousMini ? `<div class="prod-row-sub" style="color:var(--amber);">Sous le minimum de ${fmtEUR(p.conf.montantMini)} — regroupez avec la commande suivante</div>` : ''}
      </div>`;
    }).join('')}` : '';

  const cmds = p.sim.commandes.map(x=>{
    const coul = x.sansMachine || x.retard ? 'var(--rust)' : 'var(--green)';
    const n = (x.o.lignes||[]).reduce((t,l)=>t+(Number(l.qte)||0),0);
    const fait = n - x.resteTotal;
    let etat;
    if(x.sansMachine) etat = 'Aucune imprimante compatible en service';
    else if(x.retard) etat = `Prête le ${fmtDate(x.fin)}, soit ${x.jourRetard} jour${x.jourRetard>1?'s':''} trop tard`;
    else etat = `Prête le ${fmtDate(x.fin)}, limite le ${fmtDate(x.limite)}`;
    return `<div class="prod-row" style="border-left:3px solid ${coul};" onclick="prodOpenCommande('${x.o.id}')">
      <div class="prod-row-nom">${esc(x.o.client||'Sans client')} · à livrer le ${fmtDate(x.o.dateLivraison)}</div>
      <div class="prod-row-sub">${fait>0?`${fait} sur ${n} pièce${n>1?'s':''} déjà imprimée${fait>1?'s':''}`:`${n} pièce${n>1?'s':''}`} · ${(x.minutes/60).toFixed(1)} h restantes · démarrage le ${fmtDate(x.debut)}</div>
      <div class="prod-row-sub" style="color:${coul};font-weight:600;">${etat}</div>
    </div>`;
  }).join('');

  const enRetard = p.sim.enRetard.length;
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${p.sim.commandes.length}</div><div class="lbl">commandes à honorer</div></div>
      <div class="stat-card"><div class="num" style="${enRetard?'color:var(--rust);':''}">${enRetard}</div><div class="lbl">hors délai</div></div>
    </div>
    ${avert}${solution}
    <h3 class="prod-h">Bobines</h3>
    ${bobines}
    ${appro}
    <h3 class="prod-h">Commandes</h3>
    ${cmds}
    <p class="prod-note">Chaque impression démarre dès que la machine est libre et tourne sans surveillance. La machine ne se libère qu'au prochain créneau de présence du lieu, plus ${p.conf.manipulation} min pour vider le plateau. Expédition comptée ${p.conf.delaiExpedition} jours, réception d'une bobine selon le délai propre à chaque référence. Les bobines sont commandées par livraisons successives plutôt qu'en une fois, chacune au plus tard. Une machine n'imprime une pièce moins urgente que si elle se libère avant l'arrivée de la bobine attendue.</p>`;
}

/* ------------------------------ SUIVI ------------------------------
   La file des impressions telle que le planning la prévoit. On coche au fur
   et à mesure ; chaque validation retire le travail de la file et relance le
   calcul sur ce qui reste. Une impression ratée est remise dans la file. */
function viewProdSuivi(){
  const p = prodPlanning();
  const machines = prodMachines();
  if(!machines.length)
    return `<div class="empty">Aucune imprimante en service. Ajoutez vos machines pour voir le r\u00e9tro-planning.</div>`;

  const jobs = (p.sim.jobs||[]).filter(j=>!j.virtuelle);
  const runs = (state.runs||[]).filter(r=>r.at);

  // Colonnes : d'une semaine en arri\u00e8re jusqu'au dernier travail pr\u00e9vu.
  const jour = 86400000;
  const auj = prodAt(todayISO(), '12:00');
  let debut = new Date(auj.getTime() - 6*jour), fin = new Date(auj.getTime() + 2*jour);
  runs.forEach(r=>{ const d = new Date(r.at); if(d < debut) debut = new Date(d.getTime()); });
  jobs.forEach(j=>{ if(j.depart > fin) fin = new Date(j.depart.getTime()); });
  if(debut < new Date(auj.getTime() - 30*jour)) debut = new Date(auj.getTime() - 30*jour);
  if(fin > new Date(auj.getTime() + 60*jour)) fin = new Date(auj.getTime() + 60*jour);

  const cols = [];
  for(let d = new Date(debut.getTime()); d <= fin && cols.length < 70; d = new Date(d.getTime() + jour))
    cols.push(prodIso(d));

  const aujIso = todayISO();
  const cellules = {};   // printerId|date -> [chips]
  const pousse = (mid, iso, html)=>{
    const k = mid + '|' + iso;
    (cellules[k] = cellules[k] || []).push(html);
  };

  runs.forEach(r=>{
    const iso = prodIso(new Date(r.at));
    const rec = prodRecette(r.recipeId);
    const ok = r.statut === 'fait';
    pousse(r.printerId, iso,
      `<div class="rp-chip ${ok?'rp-ok':'rp-ko'}" title="${esc(rec?rec.nom:'')}">
         <span>${ok?'\u2713':'\u2715'}</span> ${esc(rec?rec.nom:'Article supprim\u00e9')}</div>`);
  });

  jobs.forEach((j,i)=>{
    const iso = prodIso(j.depart);
    const hh = String(j.depart.getHours()).padStart(2,'0') + ':' + String(j.depart.getMinutes()).padStart(2,'0');
    pousse(j.printerId, iso,
      `<div class="rp-chip rp-todo" onclick="prodChoixPiece('${j.orderId}','${j.recipeId}','${j.printerId}',${j.pieces})">
         <span>${hh}</span> ${esc(j.article)}${j.pieces>1?` \u00d7${j.pieces}`:''}</div>`);
  });

  const enTetes = cols.map(iso=>{
    const d = prodAt(iso,'12:00');
    const jr = ['dim','lun','mar','mer','jeu','ven','sam'][d.getDay()];
    return `<th class="${iso===aujIso?'rp-auj':''}">${jr}<br><b>${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</b></th>`;
  }).join('');

  // Les machines sont groupées par lieu : un atelier se lit d'un bloc.
  const parLieu = [];
  (state.sites||[]).forEach(s=>{
    const l = machines.filter(m=>m.siteId === s.id);
    if(l.length) parLieu.push({site:s, machines:l});
  });
  const orphelines = machines.filter(m=>!(state.sites||[]).some(s=>s.id === m.siteId));
  if(orphelines.length) parLieu.push({site:{nom:'Sans lieu'}, machines:orphelines});

  const ligneMachine = m=>`
    <tr><th class="rp-mac">${esc(m.nom)}</th>
      ${cols.map(iso=>`<td class="${iso===aujIso?'rp-auj':''}">${(cellules[m.id+'|'+iso]||[]).join('')}</td>`).join('')}
    </tr>`;

  const lignes = parLieu.map(g=>{
    const enTete = parLieu.length > 1
      ? `<tr class="rp-lieu"><th class="rp-mac">${esc(g.site.nom)}</th>
           <td colspan="${cols.length}">${g.machines.length} machine${g.machines.length>1?'s':''}</td></tr>`
      : '';
    return enTete + g.machines.map(ligneMachine).join('');
  }).join('');

  return `
    <p class="prod-note" style="margin:0 0 10px 0;">Une ligne par machine, une colonne par jour. Touchez une pi\u00e8ce pr\u00e9vue pour la valider ou la d\u00e9clarer rat\u00e9e : une pi\u00e8ce valid\u00e9e passe en discret, une rat\u00e9e est automatiquement replanifi\u00e9e.</p>
    <div class="rp-wrap"><table class="rp"><thead><tr><th class="rp-mac"></th>${enTetes}</tr></thead>
      <tbody>${lignes}</tbody></table></div>
    ${runs.length?`<button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="prodAnnuleDerniere()">Annuler la derni\u00e8re validation</button>`:''}`;
}

/* Choix propos\u00e9 quand on touche une pi\u00e8ce du r\u00e9tro-planning. */
function prodChoixPiece(orderId, recipeId, printerId, pieces){
  const r = prodRecette(recipeId), m = prodImprimante(printerId);
  const o = (state.orders||[]).find(x=>x.id===orderId);
  openModal(`
    <h3>${esc(r?r.nom:'Pi\u00e8ce')}</h3>
    <p class="prod-note" style="margin:0 0 14px 0;">${esc(m?m.nom:'')}${o&&o.client?' \u00b7 '+esc(o.client):''}${pieces>1?` \u00b7 ${pieces} pi\u00e8ces`:''}</p>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px;"
      onclick="prodValide('${orderId}','${recipeId}','${printerId}',${pieces},true)">Valid\u00e9e, contr\u00f4l\u00e9e</button>
    <button class="btn btn-outline" style="width:100%;justify-content:center;"
      onclick="prodValide('${orderId}','${recipeId}','${printerId}',${pieces},false)">Rat\u00e9e, \u00e0 refaire</button>
    <p class="prod-note">Une pi\u00e8ce rat\u00e9e retourne dans la file et sera replanifi\u00e9e.</p>
  `);
}

async function prodValide(orderId, recipeId, printerId, pieces, ok){
  state.runs = state.runs || [];
  const n = Number(pieces) || 1;
  state.runs.push({id:uid(), orderId, recipeId, printerId,
    pieces: ok ? n : 0, statut: ok ? 'fait' : 'rate',
    at: new Date().toISOString(), user: state.user || null});

  // Une piece validee entre directement dans le stock.
  const rec = prodRecette(recipeId);
  if(ok && rec && rec.produitFiniId && state.products.some(pp=>pp.id === rec.produitFiniId)){
    state.movements.push({id:uid(), productId:rec.produitFiniId, type:'in', qty:n,
      date:new Date().toISOString(), user:state.user || null,
      source:'production', note:'Impression validee'});
  }
  const o = (state.orders||[]).find(x=>x.id===orderId);
  if(ok && o && !o.fait && (o.lignes||[]).every(l=>prodReste(o,l) <= 0)){
    o.fait = true; toast('Commande terminée');
  }else{
    toast(ok ? 'Impression validée' : 'Impression remise dans la file');
  }
  scheduleCloudSave();
  setCloseHook(null); closeModal();   // la fenêtre de choix doit se refermer
  renderContent();
}
function prodAnnuleDerniere(){
  const L = state.runs || [];
  if(!L.length){ toast('Rien à annuler'); return; }
  askConfirm('Annuler la dernière validation ?', async ()=>{
    const r = L.pop();
    const o = r ? (state.orders||[]).find(x=>x.id===r.orderId) : null;
    if(o && o.fait) o.fait = false;
    scheduleCloudSave(); closeModal(); toast('Validation annulée'); renderContent();
  });
}
